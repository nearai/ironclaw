# Stable scheduling input for the nightly Reborn Playwright suite.
#
# Durations are allocation weights captured from successful workflow run
# https://github.com/nearai/ironclaw/actions/runs/29801208169 (2026-07-21).
# That run reported one duration per affinity group, so the group duration is
# divided across its files. The generator always re-coalesces an affinity group
# before placing it; the per-file split is only a stable, additive encoding.
# Refresh these values from a successful `--durations=25` run when a shard moves
# by more than 20%, and update captured_run/captured_at in the same change.

[playwright]
shard_count = 4
max_shard_seconds = 140
captured_run = 29801208169
captured_at = "2026-07-21"
discovery_globs = [
  "tests/e2e/scenarios/test_reborn_webui_harness_artifacts.py",
  "tests/e2e/scenarios/test_reborn_v2_file_download.py",
  "tests/e2e/scenarios/test_reborn_webui_v2_smoke.py",
  "tests/e2e/scenarios/test_reborn_webui_v2_*_api.py",
  "tests/e2e/scenarios/test_reborn_webui_v2_legacy_*.py",
]

[[waiver]]
path = "tests/e2e/scenarios/test_reborn_webui_v2_legacy_responses_api.py"
owner = "openai-compat"
reason = "Selected by the exact-node Responses manifest in the deterministic Reborn E2E lane."
evidence = "tests/e2e/reborn_responses_e2e_tests.txt"

[[suite]]
path = "tests/e2e/scenarios/test_reborn_webui_harness_artifacts.py"
affinity = "served-api-routes"
historical_seconds = 22
retry = "never"

