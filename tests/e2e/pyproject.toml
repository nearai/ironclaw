[project]
name = "ironclaw-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
    "pytest-timeout>=2.3",
    "playwright>=1.45",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.optional-dependencies]
vision = [
    "anthropic>=0.40",
]
telegram = [
    "telethon>=1.40",
]

# `fixtures/` (live-LLM record/replay JSON, no Python) sits alongside
# `scenarios/` after #3133 landed. Setuptools auto-discovery refuses a
# flat layout with multiple top-level packages, so scope discovery to
# the actual Python package and exclude data-only directories.
[tool.setuptools.packages.find]
include = ["scenarios*"]
exclude = ["fixtures*", "screenshots*", "test-pages*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 360
# Strict-by-default xfail: an XPASS (test starts passing despite the
# xfail mark) is a real failure, forcing whoever fixed the underlying
# contract to either un-xfail the test or update the reason. Two stale
# xfail(strict=False) markers in test_v2_auth_oauth_matrix.py masked
# the chat-driven tool_install regression shipped in #3366 for five
# days — neither XFAIL nor XPASS would have alerted anyone with the
# default (strict=False). Un-xfailed in #3589. Explicit
# `strict=False` is still allowed for the rare genuinely-flaky case
# but must be deliberate, not the default. See `.claude/rules/testing.md`
# for the policy.
xfail_strict = true
# `shared_world` marks the reverse replay that deliberately keeps provider
# mutations between journeys. The ordinary lane filters it out with
# `-m "not shared_world"`. A marker rather than `--deselect`: the deselect
# matched nothing once the step passed several files, and silently ran the
# test anyway.
markers = [
    "shared_world: replays journeys against one shared, un-reset provider world",
    # The autouse `assert_prompt_cache_reuse` fixture fails any test whose
    # system prompt changes without a tool-surface change. A test that
    # deliberately reconfigures the prompt mid-conversation opts out here —
    # and must say why at the marker, so the exemption stays reviewable.
    "allow_prompt_cache_churn: the test deliberately rewrites the cached system prefix",
]
