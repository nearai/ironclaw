schema_version = 1

# "tested" means the capability is claimed by some executable evidence tier —
# a typed operation case, a journey_evidence entry, an integration_evidence
# entry, or (for reads) a harvested journey that exercises it.
#
# It does NOT mean the capability is fully covered. Coverage is enforced per
# capability x outcome class by test_provider_capability_inventory.py:
# `external_write` capabilities may not rest on a harvested tool-call name,
# and reads need both a success and an empty-result case. Whatever does not
# meet those rules yet is listed in coverage_backlog below, with an owner.
