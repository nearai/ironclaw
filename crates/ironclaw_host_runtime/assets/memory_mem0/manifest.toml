schema_version = "reborn.extension_manifest.v3"
id = "mem0.local.memory"
name = "mem0 Memory"
version = "0.1.0"
description = "Self-hosted mem0 OSS backend for the always-on memory adapter (issue #5264). A compose-time [memory] binding can select this provider in place of the native filesystem backend. This manifest is the single source of truth for mem0's memory surface: the [[tools]] below (declared under the stable ironclaw.memory.* ids so a backend swap never renames the model's tools) and the [memory].lifecycle hooks the host may call. mem0 is off by default and compiled only under the `memory-mem0` feature; it requires a self-hosted mem0 base URL (never the hosted cloud) supplied through the `[memory]` config, and fails closed otherwise."
trust = "first_party_requested"

[runtime]
kind = "first_party"
service = "mem0_memory_provider"

# The [memory] surface marks this extension a backend for the host memory
# adapter; the compose-time [memory] binding selects exactly one provider
# (native by default, mem0 when explicitly bound + configured). The lifecycle
# set is honest: mem0 implements the long-term retrieval lane and profile
# reads. It has no thread partitioning (no short-term lane) and does not
# record interactions, so those hooks are not declared and the host never
# calls them.
[memory]
lifecycle = ["read_long_term", "profile_read"]

# mem0's model tool surface, declared under the reserved stable
# ironclaw.memory.* namespace so the model's memory tools keep their names
# when the backend swaps. Same schemas and gating posture as the native
# provider: reads are Ungated for LoopRun via the reviewed
# UNGATED_LOOP_RUN_CAPABILITIES allowlist, the write stays
# gated_unless_granted, Product/Automation are deny-by-default. mem0 maps
# these onto discrete memories (write is append-only; patch/replace surface a
# recoverable unsupported error at dispatch).
[[tools]]
id = "ironclaw.memory.read"
description = "Read a Reborn persistent memory document in the current tenant/user/agent/project scope."
effects = ["read_filesystem"]
default_permission = "allow"
visibility = "model"
origin_gate_matrix = { loop_run = "ungated", product = "forbidden", automation = "forbidden" }
input_schema_ref = "schemas/memory/document-read.input.v1.json"
output_schema_ref = "schemas/memory/document-read.output.v1.json"
prompt_doc_ref = "prompts/memory-native/read.md"

[[tools]]
id = "ironclaw.memory.write"
description = "Write or append Reborn persistent memory documents in the current tenant/user/agent/project scope. For structured user facts (timezone, locale, location), use ironclaw.memory.profile_set instead."
effects = ["read_filesystem", "write_filesystem"]
default_permission = "allow"
visibility = "model"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
input_schema_ref = "schemas/memory/document-write.input.v1.json"
output_schema_ref = "schemas/memory/document-write.output.v1.json"
prompt_doc_ref = "prompts/memory-native/write.md"

[[tools]]
id = "ironclaw.memory.search"
description = "Search only Reborn internal persistent memory in the current tenant/user/agent/project scope; this does not search connected app or extension data."
effects = ["read_filesystem"]
default_permission = "allow"
visibility = "model"
origin_gate_matrix = { loop_run = "ungated", product = "forbidden", automation = "forbidden" }
input_schema_ref = "schemas/memory/search.input.v1.json"
output_schema_ref = "schemas/memory/search.output.v1.json"
prompt_doc_ref = "prompts/memory-native/search.md"

[[tools]]
id = "ironclaw.memory.tree"
description = "List Reborn persistent memory documents as a compact tree."
effects = ["read_filesystem"]
default_permission = "allow"
visibility = "model"
origin_gate_matrix = { loop_run = "ungated", product = "forbidden", automation = "forbidden" }
input_schema_ref = "schemas/memory/tree.input.v1.json"
output_schema_ref = "schemas/memory/tree.output.v1.json"
prompt_doc_ref = "prompts/memory-native/tree.md"

# F6 (recorded decision, 2026-07-27): profile-write atomicity is per-provider.
# Native profile_set is a compare-and-swap loop; mem0 has no CAS, so its
# profile_set is a read-merge-write (closes the field-drop gap, and concurrent
# writers can still race). The owner accepted this variance behind the shared
# tool id — the internal system does not require write atomicity of a
# provider's profile tool.

[[tools]]
id = "ironclaw.memory.profile_set"
description = "Record a private, local fact about the user's agent context — timezone (IANA name), locale (BCP-47), or location (free label). Use this (not memory write) whenever the user states one of these so future answers stay correct. This is a private local write, not a public profile; it is unrelated to builtin.trace_commons.profile_set."
effects = ["read_filesystem", "write_filesystem"]
default_permission = "allow"
visibility = "model"
origin_gate_matrix = { loop_run = "ungated", product = "forbidden", automation = "forbidden" }
input_schema_ref = "schemas/memory/profile-set.input.v1.json"
output_schema_ref = "schemas/memory/profile-set.output.v1.json"
