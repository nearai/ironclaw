[package]
name = "ironclaw_sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
# The Docker/CA cone lives here and nowhere else — keeping it out of the kernel
# is the reason this crate exists (PROPOSAL §6.6.4).
bollard = "0.18"
rcgen = "0.14"
libc = "0.2"
time = { version = "0.3", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
futures-util = "0.3"
fs2 = "0.4"
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_common = { path = "../../contracts/ironclaw_common" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_network = { path = "../../substrates/ironclaw_network" }
ironclaw_safety = { path = "../../substrates/ironclaw_safety" }
ironclaw_secrets = { path = "../../substrates/ironclaw_secrets" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
secrecy = "0.10"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"
zeroize = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Lane tests build a real ExtensionPackage and project the three inputs the
# script lane takes, proving the projection against a parsed manifest.
# Dev-only: the production dependency is gone, which is what the layer matrix
# measures.
ironclaw_extension_registry = { path = "../../extensions/ironclaw_extension_registry" }
# Same shape, same reason (#7067): the lane's production dependency on the
# budget authority is gone — it sees only `host_api::resource`'s narrow
# `RuntimeResourceBudget` port. The tests drive that port over the REAL
# governor through `GovernorRuntimeBudget`, so a denial they assert on is a
# denial the kernel actually produced rather than one a lane-local fake made
# up. Do not re-add this under `[dependencies]`.
ironclaw_resources = { path = "../../kernel/ironclaw_resources" }
rust_decimal_macros = "1"
tokio = { version = "1", features = ["macros", "rt"] }
x509-parser = { version = "0.18", features = ["verify"] }
