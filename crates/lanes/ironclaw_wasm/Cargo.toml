[package]
name = "ironclaw_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_wasm_limiter = { path = "../ironclaw_wasm_limiter" }
futures-util = "0.3"
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
serde_json = "1"
bech32 = "0.12"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
# TLS is provided via rustls-tls-webpki-roots (uses rustls + webpki root certs).
# This ensures all relay WebSocket connections use TLS with the standard
# root certificate store — no additional TLS feature configuration needed.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
async-trait = "0.1"
# Dev-only: `wasm_dispatch_integration` drives the real `RuntimeDispatcher`.
# Previously reached through the `ironclaw_dispatcher` re-export shim (deleted
# in WS8); `test-support` on host_api came transitively via that shim's own
# `test-support` feature, so it is now declared directly.
ironclaw_capabilities = { path = "../../kernel/ironclaw_capabilities" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", features = ["test-support"] }
ironclaw_event_log = { path = "../../events/ironclaw_event_log" }
ironclaw_extension_registry = { path = "../../extensions/ironclaw_extension_registry" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_resources = { path = "../../kernel/ironclaw_resources" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wat = "1.245.1"
wit-component = "0.254.0"
wit-parser = "0.254.0"
