[package]
name = "ironclaw_mcp"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_extension_contracts = { path = "../ironclaw_extension_contracts", version = "0.1.0" }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
# Lane tests build a real ExtensionPackage and project the three inputs the
# lane takes, proving the projection against a parsed manifest. Dev-only: the
# production dependency is gone, which is what the layer matrix measures.
ironclaw_extension_registry = { path = "../ironclaw_extension_registry" }
# Same shape, same reason (#7067): the lane's production dependency on the
# budget authority is gone — it sees only `host_api::resource`'s narrow
# `RuntimeResourceBudget` port. The tests drive that port over the REAL
# governor through `GovernorRuntimeBudget`, so a denial they assert on is a
# denial the kernel actually produced rather than one a lane-local fake made
# up. Do not re-add this under `[dependencies]`.
ironclaw_resources = { path = "../ironclaw_resources" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
