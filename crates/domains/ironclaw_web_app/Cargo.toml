[package]
name = "ironclaw_web_app"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Web Push (RFC 8030/8291/8292) subscription records, payload encryption, and request planning for the web app notification channel"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1"
# ES256 keygen (VAPID) + ECDH P-256 / HKDF-SHA256 / AES-128-GCM (RFC 8291
# aes128gcm content encryption). Already linked workspace-wide via
# jsonwebtoken's aws_lc_rs backend; no new lockfile entry.
aws-lc-rs = "1"
base64 = "0.23"
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
