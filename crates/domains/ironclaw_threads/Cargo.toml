[package]
name = "ironclaw_threads"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Canonical session thread and transcript service contracts for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.2" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
# Canonical AgentMessage vocabulary for the detached accept door — the one
# provider-neutral message shape (defined with the model contracts it cleans
# up; no mirror DTOs).
ironclaw_llm = { path = "../ironclaw_llm", version = "0.1.0", default-features = false }
ironclaw_safety = { path = "../../substrates/ironclaw_safety", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
## Exposes test-only back-doors (e.g. `inject_legacy_deferred_busy_for_test`)
## needed by integration tests in a separate compilation unit. Never enable
## in production builds; this feature is intentionally off by default.
test-support = []

[dev-dependencies]
ironclaw_threads = { path = ".", features = ["test-support"] }
# FaultInjecting decorator: test store fault paths through the real store
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
