[package]
name = "ironclaw_skills"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
description = "Skill selection, scoring, and management for IronClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
# Internal-only workspace: nothing here is published (PROPOSAL §11.3).
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[package.metadata.dist]
dist = false

[dependencies]
async-trait = "0.1"
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
# FaultInjecting decorator: test store fault paths through the real store.
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
