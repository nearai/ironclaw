[package]
name = "ironclaw_network"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Dev-only seam (`.claude/rules/cargo-features.md` bar: dev-only seam AND a
# privilege boundary). Compiles the env-gated host-rewrite transport used by the
# E2E harnesses. Debug builds get it implicitly, so no lane needs to pass this;
# it exists for a release-PROFILE build that still needs the seam (and for the
# release-profile regression test that proves the refusal arm).
# Production/dist builds enable neither this nor debug_assertions, so the seam
# is not compiled into a shipped binary at all.
test-support = []

[dependencies]
async-trait = "0.1"
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util"] }
