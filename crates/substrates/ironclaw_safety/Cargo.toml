[package]
name = "ironclaw_safety"
version = "0.2.2"
edition = "2024"
rust-version.workspace = true
description = "Prompt injection defense, input validation, secret leak detection, and safety policy enforcement"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
# Internal-only workspace: nothing here is published (PROPOSAL §11.3).
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[package.metadata.dist]
dist = false

[dependencies]
aho-corasick = "1"
regex = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
urlencoding = "2"

[dev-dependencies]
criterion = "0.8"
# Test-only: pins the sandbox_credential_placeholder leak pattern against
# ironclaw_secrets::CREDENTIAL_PLACEHOLDER_PREFIX so the two can't silently
# drift apart. Deliberately not a normal dependency — ironclaw_safety stays a
# dependency-light substrate; see leak_detector.rs's
# sandbox_credential_placeholder_prefix_matches_registry test.
ironclaw_secrets = { path = "../ironclaw_secrets" }

[[bench]]
name = "safety_check"
harness = false

[[bench]]
name = "safety_pipeline"
harness = false
