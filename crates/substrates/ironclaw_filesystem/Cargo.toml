[package]
name = "ironclaw_filesystem"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Scoped filesystem service for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[features]
# Dev-only seam (rule: cargo-features.md bar #4 — the one sanctioned
# `test-support` name). Compiles the `FaultInjecting` RootFilesystem decorator
# so downstream crates can drive their *real* filesystem-backed stores against
# injected backend faults, instead of substituting a hand-rolled fault fake for
# the whole store trait (which never exercises the production store code path).
# Also compiles the shared per-test isolated-Postgres-database provisioner
# (`postgres_isolation`), so contract suites in other crates stop copying the
# stale-sweep scaffolding. Never enabled by a shipped artifact.
test-support = []

[dependencies]
async-trait = "0.1"
blake3 = "1"
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
deadpool-postgres = "0.14"
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_libsql_runtime = { path = "../ironclaw_libsql_runtime", version = "0.1.0" }
ironclaw_observability = { path = "../ironclaw_observability" }
ironclaw_safety = { path = "../ironclaw_safety", version = "0.2.2" }
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
# The Postgres contract tests provision their own container when no database
# URL is supplied, so they run in any Docker-enabled lane instead of silently
# skipping. Same image the CI lanes pre-pull.
testcontainers-modules = { version = "0.12", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
uuid = { version = "1", features = ["v4"] }
