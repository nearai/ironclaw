[package]
name = "ironclaw_event_projections"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
async-trait = "0.1"
ironclaw_event_log = { path = "../ironclaw_event_log" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Only the contract tests build timestamps; the library takes them from callers.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ironclaw_extension_registry = { path = "../ironclaw_extension_registry" }
# FaultInjecting decorator: test the projection source-error path through the real store
ironclaw_filesystem = { path = "../ironclaw_filesystem", features = ["test-support"] }
ironclaw_event_store = { path = "../ironclaw_event_store" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
