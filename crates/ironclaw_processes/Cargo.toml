[package]
name = "ironclaw_processes"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "kernel"

[features]
# In-memory-backed process store constructors for this crate's own tests and
# downstream tiers. The stores are the production `FilesystemProcess*Store<InMemoryBackend>`;
# the helpers just wire the in-memory backend seam (arch-simplification §4.3).
test-support = []

[dependencies]
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
hex = "0.4"
ironclaw_event_log = { path = "../ironclaw_event_log" }
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_resources = { path = "../ironclaw_resources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
ironclaw_event_projections = { path = "../ironclaw_event_projections" }
# FaultInjecting decorator: test store fault paths through the real store
ironclaw_filesystem = { path = "../ironclaw_filesystem", features = ["test-support"] }
ironclaw_event_store = { path = "../ironclaw_event_store" }
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote", "tls"] }
deadpool-postgres = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
uuid = { version = "1", features = ["v4", "serde"] }
