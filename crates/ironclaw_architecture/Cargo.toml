[package]
name = "ironclaw_architecture"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "app"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# Dev-only: the origin→gate matrix ratchet imports the reviewed Ungated allowlist
# from its owner (so the pin checks the REAL constant, not a copy) and parses the
# hand-authored first-party extension manifest assets. Not a production edge —
# `ironclaw_architecture` ships no runtime code.
ironclaw_host_api = { path = "../ironclaw_host_api" }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }
toml = "1.1"
# Dev-only: reborn_tls_verification_escape_hatches.rs's exact-identifier
# carve-out matching needs Rust's real XID_Continue identifier-continuation
# rule (ASCII alphanumeric/underscore alone under-matches: a combining mark
# like U+0301 is a valid identifier-continuation character to rustc but not
# `char::is_alphanumeric()`, so a look-alike `from_system_roots<combining
# mark>` would otherwise be misidentified as the real function and inherit
# its escape-hatch carve-out). Already resolves in the workspace lockfile as
# a transitive dep of proc-macro2/syn.
unicode-ident = "1"
