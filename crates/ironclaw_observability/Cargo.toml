[package]
name = "ironclaw_observability"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Low-level observability helpers for IronClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "substrates"

[dependencies]
# One dependency, deliberately. The macros expand to `tracing`; anything that
# would add a second dependency here is a measurement that belongs to its
# producer, not to this crate. See AGENTS.md.
tracing = "0.1"
