[package]
name = "ironclaw_loop_host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Loop host adapters for IronClaw Reborn AgentLoopHost implementations"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "loops"

[features]
# Compatibility feature for downstream test configurations.
test-support = []

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"
jsonschema = { version = "0.49", default-features = false }
parking_lot = "0.12"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
ironclaw_capabilities = { path = "../ironclaw_capabilities", version = "0.1.0" }
ironclaw_common = { path = "../ironclaw_common", version = "0.4.2" }
# The model gateway calls `LlmProvider` directly (WS3 runner sheds, PROPOSAL
# §6.7.2 "gains: runner's model-gateway adapter"). `default-features = false`
# keeps the provider cone out of the default build, matching every other
# `ironclaw_llm` edge in the workspace.
ironclaw_llm = { path = "../ironclaw_llm", version = "0.1.0", default-features = false }
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
ironclaw_processes = { path = "../ironclaw_processes", version = "0.1.0" }
ironclaw_host_runtime = { path = "../ironclaw_host_runtime", version = "0.1.0" }
ironclaw_observability = { path = "../ironclaw_observability" }
ironclaw_outbound = { path = "../ironclaw_outbound", version = "0.1.0" }
ironclaw_filesystem = { path = "../ironclaw_filesystem", version = "0.1.0" }
ironclaw_resources = { path = "../ironclaw_resources", version = "0.1.0" }
ironclaw_safety = { path = "../ironclaw_safety", version = "0.2.2" }
ironclaw_skills = { path = "../ironclaw_skills", version = "0.3.0", default-features = false }
ironclaw_memory = { path = "../ironclaw_memory", version = "0.1.0" }
ironclaw_threads = { path = "../ironclaw_threads", version = "0.1.0" }
ironclaw_loop_contracts = { path = "../ironclaw_loop_contracts", version = "0.1.0" }
ironclaw_turns = { path = "../ironclaw_turns", version = "0.1.0" }
ironclaw_approvals = { path = "../ironclaw_approvals", version = "0.1.0" }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
http = "1"
# Dev-only: loop_host's production use of the lane is a single capability-id
# comparison, which now reads `ironclaw_host_api::capability`. Only its tests
# construct sandbox plans, so the Docker/CA cone stays out of the loop tier.
ironclaw_sandbox = { path = "../ironclaw_sandbox", version = "0.1.0" }
ironclaw_turns = { path = "../ironclaw_turns", version = "0.1.0", features = ["test-support"] }
ironclaw_threads = { path = "../ironclaw_threads", version = "0.1.0", features = ["test-support"] }
ironclaw_outbound = { path = "../ironclaw_outbound", version = "0.1.0", features = ["test-support"] }
ironclaw_trust = { path = "../ironclaw_trust", version = "0.1.0" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rust_decimal_macros = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
