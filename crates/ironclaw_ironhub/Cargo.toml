[package]
name = "ironclaw_ironhub"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "IronHub catalog client for IronClaw Reborn: signed-catalog fetch and verification, registry install orchestration, the builtin.ironhub_* tool surface, and the agent deep-link install service"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "products"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hmac = "0.13"
ironclaw_extension_contracts = { path = "../ironclaw_extension_contracts" }
ironclaw_extension_host = { path = "../ironclaw_extension_host" }
ironclaw_extensions = { path = "../ironclaw_extensions" }
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_product = { path = "../ironclaw_product" }
ironclaw_product_contracts = { path = "../ironclaw_product_contracts" }
ironclaw_skills = { path = "../ironclaw_skills" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
ironclaw_extension_host = { path = "../ironclaw_extension_host", features = ["test-support"] }
ironclaw_filesystem = { path = "../ironclaw_filesystem", features = ["test-support"] }
