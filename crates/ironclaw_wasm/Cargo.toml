[package]
name = "ironclaw_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.ironclaw]
layer = "runtimes"

[dependencies]
ironclaw_host_api = { path = "../ironclaw_host_api" }
ironclaw_wasm_limiter = { path = "../ironclaw_wasm_limiter" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
ironclaw_extension_contracts = { path = "../ironclaw_extension_contracts", version = "0.1.0" }
async-trait = "0.1"
# Dev-only: `wasm_dispatch_integration` drives the real `RuntimeDispatcher`.
# Previously reached through the `ironclaw_dispatcher` re-export shim (deleted
# in WS8); `test-support` on host_api came transitively via that shim's own
# `test-support` feature, so it is now declared directly.
ironclaw_capabilities = { path = "../ironclaw_capabilities" }
ironclaw_host_api = { path = "../ironclaw_host_api", features = ["test-support"] }
ironclaw_event_log = { path = "../ironclaw_event_log" }
ironclaw_extension_registry = { path = "../ironclaw_extension_registry" }
ironclaw_filesystem = { path = "../ironclaw_filesystem" }
ironclaw_resources = { path = "../ironclaw_resources" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wat = "1.245.1"
wit-component = "0.254.0"
wit-parser = "0.254.0"
