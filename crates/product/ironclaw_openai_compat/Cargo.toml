[package]
name = "ironclaw_openai_compat"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Reborn-native OpenAI-compatible API contract surface"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "products"

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
ironclaw_common = { path = "../../contracts/ironclaw_common", version = "0.4.2" }
# `ProductTriggerReason` — the channel-facing DTO the submit path stamps on a
# turn — is owned here (PROPOSAL §6.1.2). §6.9.3 grants this adapter the same
# "+`extension_contracts` where channel DTOs are shared" edge `product_contracts`
# holds, so the enum is imported from its owner rather than through product.
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", version = "0.1.0" }
# Route-mount carrier vocabulary (`ProtectedRouteMount`) for `src/mount.rs`,
# the WS6 OpenAI-compat eviction: the router-state assembly this crate's own
# ports feed is owned here, and composition hands over ports rather than
# builder order. `ironclaw_host_ingress` is `substrates` — a downward edge —
# and this crate is pinned as its fifth permitted consumer in
# `reborn_same_layer_edge_inventory.rs`'s `DOWNGRADE_PINS`.
ironclaw_host_ingress = { path = "../ironclaw_host_ingress", version = "0.1.0" }
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts", version = "0.1.0" }
ironclaw_assistant = { path = "../ironclaw_assistant", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

async-stream = { version = "0.3" }
axum = { version = "0.8" }
futures-core = { version = "0.3" }
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
ironclaw_assistant = { path = "../ironclaw_assistant", version = "0.1.0", features = ["test-support"] }
ironclaw_threads = { path = "../../domains/ironclaw_threads", version = "0.1.0" }
ironclaw_turns = { path = "../../kernel/ironclaw_turns", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
