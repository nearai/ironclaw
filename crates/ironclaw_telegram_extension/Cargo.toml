[package]
name = "ironclaw_telegram_extension"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Telegram channel extension for IronClaw Reborn (#3285)"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "products"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# Production deps only. `tracing` is here for one purpose: the attachment
# transfer path must retain the cause of a provider parse failure server-side
# while the user-facing reason stays a fixed literal. `uuid` is here
# because the multipart boundary must be unpredictable: the payload is
# attacker-authored, so a boundary derived from it lets a sender force
# unbounded rescans. `ironclaw_wasm_product_adapters` stays in dev-deps
# because it is only referenced from the integration contract test crate,
# not from the adapter library itself.
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0" }
ironclaw_extension_contracts = { path = "../ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_attachments = { path = "../ironclaw_attachments", version = "0.1.0" }
ironclaw_telegram_v2_adapter = { path = "../ironclaw_telegram_v2_adapter", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# `test-support` exposes `FakeProtocolHttpEgress` / `FakeOutboundDeliverySink`
# used by the `adapter::tests` mod; it comes from `ironclaw_host_api`, which
# owns them. The `ironclaw_product` dev-dep that used to sit here supplied
# neither and went with the crate's normal `ironclaw_product` edge (WS1.3).
# The `host-auth-mint` opt-in that also sat here was stale — WS1.5 re-measured
# it and this crate names no mint function and no `ProtocolAuthEvidence` at
# all; `payload::tests`, which the comment claimed needed it, lives in
# `ironclaw_telegram_v2_adapter`. The integration
# contract suite that previously pulled in
# `http`, `ironclaw_host_api`, and `ironclaw_wasm_product_adapters` has
# been removed pending the post-#3352 fixture port — re-add those when
# the contract suite returns.
ironclaw_host_api = { path = "../ironclaw_host_api", version = "0.1.0", features = ["test-support"] }
# The exported channel-adapter conformance suite moved here with
# `ChannelAdapter` (WS1.4); `tests/channel_conformance.rs` runs it.
ironclaw_extension_contracts = { path = "../ironclaw_extension_contracts", version = "0.1.0", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
