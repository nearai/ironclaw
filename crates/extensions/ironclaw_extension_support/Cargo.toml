[package]
name = "ironclaw_extension_support"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "First-party userland extension implementations for IronClaw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
# `runtimes`, not `loops` (WS3, 2026-08-04). The executor/adapter seam this
# crate was re-chartered around in WS3 makes the *kernel* a designed consumer:
# a tool arrives here as an executor and leaves its `FirstPartyCapabilityHandler`
# in `ironclaw_host_runtime`, so `host_runtime -> extension_support` is
# structural, not transitional. A crate the kernel is designed to call cannot
# sit two rungs above it. `runtimes` is the least demotion that legalizes that
# consumer, it matches this crate's own §8.2 posture (mediated services arrive
# by injection; kernel ✗ — the same cell the wasm/mcp/sandbox lanes carry), and
# it costs zero same-layer edges, where `substrates` would hide six of this
# crate's seven dependencies from the layer matrix. Ceiling checked both ways:
# every normal dependency and every domain this crate's charter names
# (memory, traces, triggers) is `substrates` or `contracts`; every consumer is
# `kernel` or above. Consumer set frozen by the `DowngradePin` in
# `reborn_same_layer_edge_inventory.rs`.
layer = "runtimes"

[dependencies]
async-trait = "0.1"
base64 = "0.23.0"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures-util = "0.3"
glob = "0.3"
htmd = "0.5.5"
ironclaw_auth = { path = "../../domains/ironclaw_auth" }
ironclaw_common = { path = "../../contracts/ironclaw_common" }
ironclaw_extractors = { path = "../../domains/ironclaw_extractors" }
ironclaw_documents = { path = "../../substrates/ironclaw_documents", version = "0.1.0" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_observability = { path = "../../substrates/ironclaw_observability" }
ironclaw_safety = { path = "../../substrates/ironclaw_safety" }
ironclaw_skills = { path = "../../domains/ironclaw_skills" }
mime = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
unicode-normalization = "0.1"
url = "2"
# ZIP skill bundles fetched by `builtin.skill_install` from an HTTPS/GitHub
# source are extracted here (WS3, moved from `ironclaw_host_runtime`).
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
ironclaw_loop_contracts = { path = "../../contracts/ironclaw_loop_contracts", version = "0.1.0" }
ironclaw_auth = { path = "../../domains/ironclaw_auth", features = ["test-support"] }
# Dev-only: coding-tool tests re-run the loop-boundary safe-summary validator
# (`LoopSafeSummary`) to pin that dispatch failure reasons survive it.
ironclaw_turns = { path = "../../kernel/ironclaw_turns" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
