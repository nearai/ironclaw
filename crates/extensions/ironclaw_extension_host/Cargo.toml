[package]
name = "ironclaw_extension_host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Generic extension lifecycle host, active snapshot, loaders, and resolvers for IronClaw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "loops"

[features]
# Lightweight in-crate test fakes (fixtures, scripted adapters) reused by
# downstream integration tests. Zero-byte in production.
test-support = [
    "ironclaw_auth/test-support",
    "ironclaw_filesystem/test-support",
    "ironclaw_host_api/test-support",
    "ironclaw_processes/test-support",
]
# Dormant marker for the two moved test modules that still require composition
# runtime-substrate fixtures. Keep disabled until those tests are rewritten over
# extension-host-local fakes.
composition-substrate-tests = []

[dependencies]
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hmac = "0.13"
hex = "0.4.3"
ironclaw_auth = { path = "../../domains/ironclaw_auth" }
# `InboundAttachmentLander` — the channel host lands inbound attachment bytes
# before accepting a message.
ironclaw_attachments = { path = "../../domains/ironclaw_attachments" }
ironclaw_approvals = { path = "../../kernel/ironclaw_approvals" }
ironclaw_authorization = { path = "../../kernel/ironclaw_authorization" }
ironclaw_capabilities = { path = "../../kernel/ironclaw_capabilities" }
ironclaw_common = { path = "../../contracts/ironclaw_common" }
ironclaw_conversations = { path = "../../domains/ironclaw_conversations" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem" }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api" }
ironclaw_product_contracts = { path = "../../contracts/ironclaw_product_contracts", version = "0.1.0" }
ironclaw_extension_contracts = { path = "../../contracts/ironclaw_extension_contracts", version = "0.1.0" }
ironclaw_host_ingress = { path = "../../product/ironclaw_host_ingress" }
ironclaw_extension_registry = { path = "../ironclaw_extension_registry" }
ironclaw_extension_support = { path = "../ironclaw_extension_support" }
ironclaw_host_runtime = { path = "../../kernel/ironclaw_host_runtime" }
ironclaw_llm = { path = "../../domains/ironclaw_llm", default-features = false }
ironclaw_loop_host = { path = "../../loop/ironclaw_loop_host" }
ironclaw_mcp = { path = "../../lanes/ironclaw_mcp" }
ironclaw_network = { path = "../../substrates/ironclaw_network" }
ironclaw_outbound = { path = "../../domains/ironclaw_outbound" }
ironclaw_processes = { path = "../../kernel/ironclaw_processes" }
ironclaw_config = { path = "../../app/ironclaw_config" }
ironclaw_resources = { path = "../../kernel/ironclaw_resources" }
ironclaw_safety = { path = "../../substrates/ironclaw_safety" }
ironclaw_secrets = { path = "../../substrates/ironclaw_secrets" }
ironclaw_skills = { path = "../../domains/ironclaw_skills" }
ironclaw_threads = { path = "../../domains/ironclaw_threads" }
ironclaw_triggers = { path = "../../domains/ironclaw_triggers" }
ironclaw_trust = { path = "../../kernel/ironclaw_trust" }
ironclaw_loop_contracts = { path = "../../contracts/ironclaw_loop_contracts", version = "0.1.0" }
ironclaw_turns = { path = "../../kernel/ironclaw_turns" }
axum = { version = "0.8" }
fs4 = "1.1"
futures = "0.3"
lru = { version = "0.18" }
rand = "0.10"
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
ironclaw_skills = { path = "../../domains/ironclaw_skills" }
serde_json = "1"

[dev-dependencies]
# Property testing for the shared ingress verifier (#6524 workstream 9).
proptest = "1"
ironclaw_auth = { path = "../../domains/ironclaw_auth", features = ["test-support"] }
ironclaw_authorization = { path = "../../kernel/ironclaw_authorization" }
ironclaw_filesystem = { path = "../../substrates/ironclaw_filesystem", features = ["test-support"] }
ironclaw_host_api = { path = "../../contracts/ironclaw_host_api", features = ["test-support"] }
ironclaw_host_runtime = { path = "../../kernel/ironclaw_host_runtime", features = ["test-support"] }
ironclaw_outbound = { path = "../../domains/ironclaw_outbound", features = ["test-support"] }
ironclaw_processes = { path = "../../kernel/ironclaw_processes", features = ["test-support"] }
ironclaw_assistant = { path = "../../product/ironclaw_assistant", features = ["test-support"] }
ironclaw_resources = { path = "../../kernel/ironclaw_resources", features = ["test-support"] }
ironclaw_slack_extension = { path = "../packages/slack" }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
# Installs a level-appropriate subscriber so a `tracing` body actually runs
# under test: `tracing` short-circuits on the null dispatcher, so without one
# the log a sanitization test needs to inspect is never formatted, and a test
# cannot tell "logged the cause" apart from "dropped it". Both halves of this
# crate's log guards depend on that distinction — the DEBUG-level lifecycle
# sanitization tests and the WARN-level transient-cause test, whose 503 body is
# deliberately sanitized.
tracing-subscriber = "0.3"

[[test]]
name = "lifecycle_contract"
required-features = ["test-support"]

[[test]]
name = "ingress_router_contract"
required-features = ["test-support"]

[[test]]
name = "admin_configuration_store_contract"

[[test]]
name = "admin_configuration_service_contract"

[[test]]
name = "lifecycle_restore_contract"
