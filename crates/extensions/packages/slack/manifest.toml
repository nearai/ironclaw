handle = "slack_user_token"
vendor = "slack"
scopes = ["search:read", "channels:history", "groups:history", "im:history", "mpim:history", "channels:read", "groups:read", "im:read", "mpim:read", "users:read", "reactions:read", "reactions:write"]
audience = { scheme = "https", host = "slack.com" }
