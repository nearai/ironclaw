schema_version = "reborn.extension_manifest.v3"
id = "slack"
name = "Slack"
version = "0.1.0"
description = "Slack: DM the assistant via the Slack Events API channel (workspace bot), and act as you via your own user token (xoxp-): search and read all your messages, post, edit, delete, and react as you, open DMs, and look up people in your workspace."
trust = "first_party_requested"

[runtime]
kind = "wasm"
module = "wasm/slack_user_tool.wasm"

[admin_configuration]
group_id = "extension.slack"
display_name = "Slack deployment configuration"
description = "Deployment credentials for the Slack workspace bot, from your app at api.slack.com/apps. Slack delivers events by webhook, so the instance must be reachable over public HTTPS — a local installation needs a tunnel (such as ngrok or Cloudflare Tunnel) in front of it. Each person connects their own Slack account separately, from the Extensions page."
fields = [
  { handle = "slack_bot_token", label = "Bot token", secret = true, required = true, description = "The Bot User OAuth Token (xoxb-…) under OAuth & Permissions, available once the app is installed to your workspace." },
  { handle = "slack_signing_secret", label = "Signing secret", secret = true, required = true, description = "From Basic Information → App Credentials. Used to verify that incoming requests really came from Slack." },
  { handle = "slack_team_id", label = "Workspace (team) ID", secret = false, required = true, description = "Your workspace id (T…) — also the team_id in every Events API payload." },
  { handle = "slack_api_app_id", label = "App ID", secret = false, required = true, description = "From Basic Information → App ID (A…) — also the api_app_id in Events API payloads." },
  { handle = "slack_installation_id", label = "Installation ID", secret = false, required = true, description = "A stable label you choose for this app/workspace installation, e.g. slack-acme." },
  { handle = "slack_bot_user_id", label = "Bot user ID", secret = false, required = true, description = "The bot's member id (U…), shown under App Home or returned by auth.test with the bot token." },
  { handle = "slack_oauth_client_id", label = "OAuth client ID", secret = false, required = true, description = "From Basic Information → App Credentials. Used for personal (per-user) Slack authorization." },
  { handle = "slack_oauth_client_secret", label = "OAuth client secret", secret = true, required = true, description = "From Basic Information → App Credentials, next to the client ID." },
]
# Retired handles (run-acts-as-invoker): `slack_shared_subject_user_id`,
# `slack_subject_routes`, and the interim `slack_allowed_channels` allowlist
# are gone — a shared channel runs as whoever invoked the bot, and adding the
# bot to a channel is what admits it (presence-based; the message arriving
# through this channel's verified ingress is the membership evidence). Saved
# values for retired handles are inert; new saves fail closed as unknown
# fields.

# Least-privilege scopes: the read-only tools request only read scopes; each
# write tool adds exactly the scope its vendor call needs — chat:write
# (send/edit/delete), reactions:read + reactions:write (the reaction pair),
# im:write (open_dm). The slack OAuth grant is the union of these (the
# [auth.slack] recipe ceiling — a single account shared by all tools), so a
# read-only user still grants every write scope while the write tools are
# default tools. Reducing the grant for read-only users needs a write-opt-in /
# scope-upgrade re-consent flow — tracked separately.
#
# The union grew when the remaining eight core standard ops landed:
# reactions:read, reactions:write, and im:write are the new members. An
# account connected before that change holds a token without them, and the
# HOST's credential staging — not Slack — is what answers those three tools:
# runtime account selection requires the stored grant to carry each tool's
# scopes (`runtime_selection_still_enforces_provider_scope_gate` in
# ironclaw_auth), so the pre-widening account resolves to the AuthRequired
# re-auth gate. Reconnecting through that gate requests THIS manifest's
# widened union and updates the same account in place (OAuth binding
# deliberately skips the scope gate), after which all sixteen tools work.
# Slack's own missing_scope answer still exists for server-side drift on an
# account that PASSED staging (a scope revoked after connect); the guest maps
# that to messaging.permission_denied — a model-visible denial, not a re-auth
# loop, because re-running OAuth would re-request exactly what the account
# already claims to hold. Every pre-widening READ tool keeps working
# untouched in the meantime.

# ---- tool surfaces ---------------------------------------------------------

[[tools]]
standard_op = "search_messages"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "slack.search_messages"
description = "Slack notes: indexed search — for the newest message in a known conversation use get_conversation_history instead. Requires the search:read user scope. Raw Slack ids are for tool calls only — never include one in a reply."
effects = ["network", "use_secret"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/slack/search_messages.md"

[[tools.credentials]]
handle = "slack_user_token"
vendor = "slack"
scopes = ["search:read", "channels:history", "groups:history", "im:history", "mpim:history", "channels:read", "groups:read", "im:read", "mpim:read", "users:read"]
audience = { scheme = "https", host = "slack.com" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
standard_op = "list_conversations"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "slack.list_conversations"
description = "Slack notes: lists channels, private channels, DMs, and group DMs visible to you; is_member is the authoritative membership signal. DM entries carry the counterpart user."
effects = ["network", "use_secret"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/slack/list_conversations.md"

[[tools.credentials]]
handle = "slack_user_token"
vendor = "slack"
scopes = ["search:read", "channels:history", "groups:history", "im:history", "mpim:history", "channels:read", "groups:read", "im:read", "mpim:read", "users:read"]
