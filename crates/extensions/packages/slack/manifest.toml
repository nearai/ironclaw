# ---- channel surface (at most one per extension) ---------------------------

[channel]
id = "messages"
display_name = "Slack messages"
conversation_model = "continuous"
commands = ["model", "status", "new", "stop", "interrupt"]

# For a conversational vendor the two axes happen to share one mechanism — a
# message in the conversation — which is exactly why the reply/delivery
# distinction stayed invisible until a streaming channel existed. They are
# still declared separately: `message` twice is a coincidence of transport,
# not one concept.
[channel.reply]
transport = "message"

[channel.delivery]
transport = "message"

[channel.connection]
provider = "slack"
strategy = "oauth"
instructions = "Connect your Slack account with OAuth from the Slack extension configuration. The workspace bot is configured once by an administrator; this connection authorizes only your personal Slack tools and identity."
input_placeholder = ""
submit_label = "Connect Slack"
error_message = "Slack OAuth connection failed. Try connecting Slack again."
connection_success_message = "Slack is installed and connected for this user. Slack tools use the user's OAuth account, while inbound and outbound channel messages use the administrator-configured workspace bot."

[channel.connection.notices]
connect_required = "👋 Connect your Slack account in the IronClaw web app, then message me here again."
paired = "✅ Slack is connected. You can talk to IronClaw here."
already_paired_same_user = "✅ This Slack account is already connected to you."
already_bound_to_other_user = "This Slack account is already connected to another IronClaw user."
expired_or_unknown = "That Slack connection is invalid or expired. Start a fresh OAuth connection from IronClaw."

[channel.ingress]
route_suffix = "events"
method = "post"
body_limit_bytes = 1048576

[channel.ingress.verification]
kind = "hmac_sha256"
secret_handle = "slack_signing_secret"
signature_header = "X-Slack-Signature"
signature_prefix = "v0="
signature_encoding = "hex"
timestamp_header = "X-Slack-Request-Timestamp"
max_age_seconds = 300
signed_payload = [
  { literal = "v0:" },
  { header = "X-Slack-Request-Timestamp" },
  { literal = ":" },
  { body = true },
]

[[channel.egress]]
scheme = "https"
host = "slack.com"
methods = ["post"]
credential_handle = "slack_bot_token"
paths = [
  "/api/chat.postMessage",
  "/api/chat.postEphemeral",
  "/api/chat.delete",
  "/api/conversations.open",
  "/api/files.completeUploadExternal",
  # 👀→✅ run-lifecycle reaction on the triggering message (needs the
  # reactions:write scope operator-side; a missing scope fails the reaction
  # best-effort and never fails the run).
  "/api/reactions.add",
  "/api/reactions.remove",
]
request_body_limit_bytes = 262144
response_body_limit_bytes = 262144

# conversations.history / conversations.replies hydrate shared-channel pings
# with recent conversation context at ingress. The bot needs the
# channels:history-family scopes granted operator-side; when absent, Slack
# returns missing_scope and the ping proceeds with no context.
[[channel.egress]]
scheme = "https"
host = "slack.com"
methods = ["get"]
credential_handle = "slack_bot_token"
paths = [
  "/api/files.info",
  "/api/files.getUploadURLExternal",
  "/api/conversations.history",
  "/api/conversations.replies",
]
request_body_limit_bytes = 0
response_body_limit_bytes = 262144

# Private downloads remain under Slack's exact file host and prefix. The bot
# credential is injected by the host and the response cap matches the shared
# per-file attachment budget.
[[channel.egress]]
scheme = "https"
host = "files.slack.com"
methods = ["get"]
credential_handle = "slack_bot_token"
path_prefixes = ["/files-pri/"]
request_body_limit_bytes = 0
response_body_limit_bytes = 5242880

# External upload tickets are pre-authorized by Slack. File bytes carry no bot
# credential and are limited to the same per-file attachment budget.
[[channel.egress]]
scheme = "https"
host = "files.slack.com"
methods = ["post"]
path_prefixes = ["/upload/"]
request_body_limit_bytes = 5242880
response_body_limit_bytes = 262144

[channel.presentation]
supports_markdown = true
supports_threads = true
can_reply_in_threads = true
command_prefix = "/ironclaw "

# ---- auth surface: recipe data, zero extension code ------------------------

[auth.slack]
method = "oauth2_code"
display_name = "Slack account"
authorization_endpoint = "https://slack.com/oauth/v2/authorize"
token_endpoint = "https://slack.com/api/oauth.v2.access"
scope_param = "user_scope"
pkce = "s256"
# The union of every [[tools.credentials]] scope list above — one grant shared
# by all tools. reactions:read/reactions:write/im:write joined it with the
# reaction pair and open_dm; see the least-privilege note at the top of this
# file for what that means for accounts connected before then.
scopes = ["search:read", "channels:history", "groups:history", "im:history", "mpim:history", "channels:read", "groups:read", "im:read", "mpim:read", "users:read", "chat:write", "reactions:read", "reactions:write", "im:write"]
client_credentials = { client_id_handle = "slack_oauth_client_id", client_secret_handle = "slack_oauth_client_secret" }

[auth.slack.token_response]
access_token = "/authed_user/access_token"
scope = { path = "/authed_user/scope", missing = "fallback_to_requested" }

[auth.slack.identity]
account_id = "/authed_user/id"
team_id = "/team/id"
enterprise_id = "/enterprise/id"
app_id = "/app_id"
