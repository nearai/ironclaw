id = "slack.open_dm"
description = "Slack notes: returns the existing DM when one is already open, so calling it twice is safe and never creates a duplicate. user_ref must be a real Slack user id (U…/W…) from a people operation — never a conversation id. Requires the im:write user scope."
effects = ["network", "use_secret", "external_write"]
