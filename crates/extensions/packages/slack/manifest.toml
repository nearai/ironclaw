id = "slack.get_message"
description = "Slack notes: Slack has no single-message endpoint, so this reads the conversation at that exact timestamp and falls back to the thread when the message is a threaded reply; either way only an exact timestamp match is returned, never a neighbouring message. Raw Slack ids are for tool calls only — never include one in a reply."
effects = ["network", "use_secret"]
