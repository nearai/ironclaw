audience = { scheme = "https", host = "slack.com" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

# The eight entries below complete Slack's coverage of the 16 core standard
# messaging operations. They are appended rather than interleaved so the
# v2-era eight keep their original positions, which the v2->v3 projection
# parity gate compares positionally
# (crates/app/ironclaw_composition/tests/first_party_manifest_v3_parity.rs).

[[tools]]
standard_op = "edit_message"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "slack.edit_message"
description = "Slack notes: text is Slack mrkdwn and replaces the whole message body — Slack has no partial edit. Only your own messages are editable, and a workspace may cap how long after posting. Requires the chat:write user scope."
effects = ["network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/slack/edit_message.md"

[[tools.credentials]]
handle = "slack_user_token"
vendor = "slack"
scopes = ["search:read", "channels:history", "groups:history", "im:history", "mpim:history", "channels:read", "groups:read", "im:read", "mpim:read", "users:read", "chat:write"]
audience = { scheme = "https", host = "slack.com" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
standard_op = "delete_message"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "slack.delete_message"
description = "Slack notes: deletion is permanent and only your own messages can be deleted. Deleting a thread parent also removes its replies. Requires the chat:write user scope."
effects = ["network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/slack/delete_message.md"

[[tools.credentials]]
handle = "slack_user_token"
vendor = "slack"
scopes = ["search:read", "channels:history", "groups:history", "im:history", "mpim:history", "channels:read", "groups:read", "im:read", "mpim:read", "users:read", "chat:write"]
audience = { scheme = "https", host = "slack.com" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
standard_op = "add_reaction"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "slack.add_reaction"
description = "Slack notes: emoji is a Slack short name without colons (`thumbsup`, not `:thumbsup:` — surrounding colons are stripped for you); unicode characters are not accepted. A reaction you have already added is reported as applied rather than as an error. Requires the reactions:write user scope."
effects = ["network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/slack/add_reaction.md"

# reactions:write only — this tool calls reactions.add and nothing else. Its
# sibling remove_reaction additionally reads (reactions.get) to find the
# connected account's own reactions, so reactions:read belongs there alone.
[[tools.credentials]]
handle = "slack_user_token"
vendor = "slack"
scopes = ["search:read", "channels:history", "groups:history", "im:history", "mpim:history", "channels:read", "groups:read", "im:read", "mpim:read", "users:read", "reactions:write"]
audience = { scheme = "https", host = "slack.com" }
injection = { type = "header", name = "authorization", prefix = "Bearer " }

[[tools]]
standard_op = "remove_reaction"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "slack.remove_reaction"
description = "Slack notes: emoji is a Slack short name without colons (`thumbsup`, not `:thumbsup:`). Omit emoji to remove every reaction you personally added to the message — that variant reads the message's reactions first and needs the reactions:read user scope as well. Only your own reactions are ever removed. Requires the reactions:write user scope."
effects = ["network", "use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/slack/remove_reaction.md"

