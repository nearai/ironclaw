# The Telegram extension: two capability surfaces on ONE extension id.
#
#   * `[channel]` — the deployment's Telegram **bot**, over the Bot API and a
#     verified webhook. Unchanged by the linked-device work.
#   * `[[tools]]` + `[auth.telegram]` — the user's **own** Telegram account,
#     linked as a device over MTProto. Reads are live; writes act as the user.
#
# There is no companion extension id for the linked account (pinned by
# `telegram_extension_gates.rs`), and no separate channel registry: a channel
# is one surface of an extension, exactly like tools and auth.
schema_version = "reborn.extension_manifest.v3"
id = "telegram"
name = "Telegram"
version = "0.1.0"
description = "Telegram: DM the assistant through the workspace bot, and — once you link your own Telegram account as a device — read your chats and send messages as you."
trust = "first_party_requested"

[runtime]
kind = "first_party"
service = "telegram.extension/v1"

[admin_configuration]
group_id = "extension.telegram"
display_name = "Telegram deployment configuration"
description = "Deployment credentials for the Telegram channel. Telegram delivers updates by webhook, so the instance must be reachable over public HTTPS with a valid certificate — a local installation needs a tunnel (such as ngrok or Cloudflare Tunnel) in front of it."
fields = [
  { handle = "telegram_bot_token", label = "Bot token", secret = true, required = true, description = "Issued by BotFather when you create the bot (/newbot)." },
  { handle = "telegram_webhook_secret", label = "Webhook secret token", secret = true, required = true, description = "A random string you invent (1–256 letters, digits, '_' or '-'). IronClaw registers it with Telegram and uses it to verify every incoming update." },
  { handle = "telegram_webhook_url", label = "Public webhook URL", secret = false, required = true, description = "The full public address Telegram delivers to: https://<your-host>/webhooks/extensions/telegram/updates. For a local installation, use your tunnel's hostname." },
  { handle = "bot_username", label = "Bot username", secret = false, required = true, description = "Your bot's username without the leading @ (5–32 characters, ending in 'bot'). Used for group mentions and bot display." },
  # MTProto application identity for the linked-device surface, operator-supplied
  # (PROPOSAL §11 decision 2): bundling one id across every deployment would pool
  # Telegram's flood limits and invite `API_ID_PUBLISHED_FLOOD`, which permanently
  # bans published ids. `api_hash` is marked secret because Telegram treats it as
  # one. Both are `required = false` ON PURPOSE: a deployment that only runs the
  # bot channel must keep booting with its existing configuration, and the
  # device-link flow fails closed with an explicit "not configured" error rather
  # than making every existing install invalid.
  { handle = "telegram_api_id", label = "MTProto api_id (linked accounts)", secret = false, required = false, description = "From my.telegram.org → API development tools. Only needed to link a personal account; the bot channel works without it." },
  { handle = "telegram_api_hash", label = "MTProto api_hash (linked accounts)", secret = true, required = false, description = "The api_hash issued beside your api_id at my.telegram.org. Treated as a secret." },
]
# Shared-conversation admission is presence-based (run-acts-as-invoker):
# any group/supergroup the bot has been added to is served — the update
# arriving through this channel's verified webhook is the membership
# evidence — and each participant runs as themselves once paired.

# ---- auth surface ----------------------------------------------------------
#
# Device-link is the one auth method whose mechanics an extension implements
# rather than declares (PROPOSAL §3.2): MTProto login is a live handshake —
# `auth.ExportLoginToken` polling, DC migration via `ImportLoginToken`, SRP
# 2FA — and no descriptor expresses that. Everything below is display metadata
# for the connect card; the protocol lives behind `DeviceLinkAdapter`.
[auth.telegram]
method = "device_link"
display_name = "Telegram account"
default_mode_label = "Scan a QR code"
alternate_mode_label = "Use my phone number"
instructions = "On your phone, open Telegram → Settings → Devices → Link Desktop Device and scan the code shown here. IronClaw connects as a third-party client, so Telegram may restrict accounts that use one; you can revoke this device at any time from that same Devices list."

# ---- tool surface (the linked account) -------------------------------------
#
# Every entry below is a `standard_op` binding, so the host synthesizes the
# canonical input/output schemas and NO tool declares `input_schema_ref` /
# `output_schema_ref` (the v3 parser rejects one that does). `get_thread_replies`
# is deliberately NOT bound: Telegram returns thread replies inline in a chat's
# history, so a separate replies op would have nothing distinct to fetch.
#
# EFFECTS HONESTY (PROPOSAL §6.7, first open question — decided here).
# Slack's tool bindings declare `network`, which in this workspace means
# *host-mediated* egress: the host owns the allowlist, injects the credential,
# caps the response, and blocks private-IP targets. The linked-device tools
# reach Telegram over a raw MTProto socket the host does not mediate (§3.4), so
# declaring `network` would assert a mediation that does not happen AND would
# derive a `host.runtime.http_egress` port these tools never use. It is
# therefore deliberately ABSENT. What remains is truthful: `use_secret` (a
# host-custodied session credential is genuinely consumed) plus `external_write`
# on every write op. The carve-out itself is compensated in code — sockets are
# confined to `src/linked/transport.rs` and every dial is gated by
# `IronclawSession::dc_option`.
#
# `[[tools.credentials]]` SHAPE (§6.7, second open question — decided here).
# A device-link session is never injected into an HTTP request and has no HTTP
# audience, yet the block is what makes tool availability depend on a linked
# account: it resolves to a `ProductAuthAccount { provider: telegram, setup:
# DeviceLink }` requirement, so an un-linked user's calls surface `AuthRequired`
# and the connect affordance rather than running. The declaration is kept
# structurally inert rather than plausible-looking: the audience host is a
# reserved `.invalid` name that can never resolve, and the header name is
# explicitly self-describing, so even a future wiring mistake fails closed
# instead of silently injecting the session into someone's request. Nothing
# consumes either field today — these tools declare no `network` effect, so no
# `RestrictedEgress` port is derived and there is no request to inject into.
#
# PERMISSIONS. Writes act as the user and are indistinguishable to recipients,
# so `default_permission = "ask"` with `product` and `automation` forbidden.
# READS are gated the same way, including `automation = "forbidden"`: a personal
# Telegram account can be DM'd by any stranger on earth, so a read is an ingress
# of attacker-controlled text into a context that also holds `send_message` as
# the user (§6.4). Until tool results carry an untrusted-content envelope, an
# unattended run must not be that ingress.

[[tools]]
standard_op = "send_message"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "telegram.send_message"
description = "Telegram notes: sends from the user's OWN linked Telegram account — recipients see it as a personal message from them, not from a bot. Conversation refs come from list_conversations / open_dm / get_conversation_info; never invent or hand-edit one. Telegram has one reply mechanism, so thread and reply_to both map to it. When Telegram accepts the send but returns no correlatable message id the result carries sent_unverified: true — the message WAS delivered, so never re-send it, but it cannot later be edited, deleted, or reacted to. Final answers to the user are delivered by the host, not by this tool."
effects = ["use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/telegram/send_message.md"

[[tools.credentials]]
handle = "telegram_linked_session"
vendor = "telegram"
audience = { scheme = "https", host = "linked-device.telegram.invalid" }
injection = { type = "header", name = "x-ironclaw-telegram-linked-session-never-injected" }

[[tools]]
standard_op = "edit_message"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "telegram.edit_message"
description = "Telegram notes: edits a message the linked account sent. Telegram closes the edit window after 48 hours in most chats and refuses edits on messages the account did not author."
effects = ["use_secret", "external_write"]
default_permission = "ask"
visibility = "model"
prompt_doc_ref = "prompts/telegram/edit_message.md"

[[tools.credentials]]
handle = "telegram_linked_session"
vendor = "telegram"
audience = { scheme = "https", host = "linked-device.telegram.invalid" }
