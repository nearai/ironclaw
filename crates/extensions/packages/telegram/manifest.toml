# ---- channel surface -------------------------------------------------------

[channel]
id = "messages"
display_name = "Telegram messages"
conversation_model = "continuous"
commands = ["model", "status", "new", "stop", "interrupt"]

# For a conversational vendor the two axes happen to share one mechanism — a
# message in the chat — which is exactly why the reply/delivery distinction
# stayed invisible until a streaming channel existed. They are still declared
# separately: `message` here is a coincidence of transport, not one concept.
[channel.reply]
transport = "message"

[channel.delivery]
transport = "message"

[channel.connection]
provider = "telegram"
strategy = "web_generated_code"
instructions = "Open the workspace bot and send the generated code. This pairs your Telegram identity with the bot only; it does not link your personal account or enable personal-account tools."
input_placeholder = ""
submit_label = "Connect workspace bot"
error_message = "Telegram workspace-bot pairing failed. Generate a new code and try again."
connection_success_message = "The workspace bot is connected. You can chat with IronClaw through the bot without linking your personal Telegram account. Personal-account tools remain unavailable until you separately link your account as a device."
deep_link_template = "https://t.me/{bot_username}?start={code}"
inbound_code_prefixes = ["/start"]

[channel.connection.notices]
connect_required = "👋 Connect this Telegram account to the workspace bot from the Telegram extension in IronClaw, then message me again."
paired = "✅ Workspace bot connected. You can talk to IronClaw right here."
already_paired_same_user = "✅ This Telegram account is already connected to your IronClaw user through the workspace bot."
already_bound_to_other_user = "This Telegram account is already connected to another IronClaw user."
expired_or_unknown = "This pairing code is expired or unknown. Generate a new code from the Telegram extension in IronClaw."

[channel.ingress]
route_suffix = "updates"
method = "post"
body_limit_bytes = 1048576

[channel.ingress.verification]
kind = "shared_secret_header"
secret_handle = "telegram_webhook_secret"
header = "X-Telegram-Bot-Api-Secret-Token"

# Vendor-side webhook wiring, formerly ChannelAdapter::activate/cleanup. Both
# method bodies became zero lines: every input was already host-known (the
# host owns the webhook route, so it owns the URL), and both calls already ran
# through restricted egress with host-side credential injection. The bot token
# rides the path placeholder the [[channel.egress]] injection declares; the
# shared secret rides body_credentials, so neither ever enters adapter scope.
# `setWebhook` is idempotent — Telegram overwrites the previous registration.
[channel.ingress.registration]
method = "post"
path = "/bot{telegram_bot_token}/setWebhook"
body = { url = "{telegram_webhook_url}" }
body_credentials = ["telegram_webhook_secret"]

[channel.ingress.deregistration]
method = "post"
path = "/bot{telegram_bot_token}/deleteWebhook"
body = {}

[[channel.egress]]
scheme = "https"
host = "api.telegram.org"
methods = ["post"]
credential_handle = "telegram_bot_token"
paths = [
  "/bot{telegram_bot_token}/setWebhook",
  "/bot{telegram_bot_token}/deleteWebhook",
  "/bot{telegram_bot_token}/sendMessage",
  "/bot{telegram_bot_token}/deleteMessage",
  "/bot{telegram_bot_token}/setMessageReaction",
  "/bot{telegram_bot_token}/getFile",
  "/bot{telegram_bot_token}/sendDocument",
]
# sendDocument carries one canonical 5 MiB file plus bounded multipart fields
# (TELEGRAM_MAX_TRANSFER_BYTES + TELEGRAM_MULTIPART_OVERHEAD_BYTES; pinned by
# `manifest_transfer_bounds_match_the_adapter_constants`).
request_body_limit_bytes = 5308416
# This target also serves sendMessage/deleteMessage, whose responses echo the
# full Message object — including `reply_to_message` when the adapter threads a
# reply. A tight cap here would fail an already-delivered send, so it keeps the
# host default rather than the file-sized bound.
response_body_limit_bytes = 262144
# The Bot API carries the token in the URL path (`/bot<token>/method`); the
# adapter writes the `{telegram_bot_token}` placeholder and the host
# substitutes the secret — token bytes never reach the adapter.
injection = { type = "path_placeholder", placeholder = "telegram_bot_token" }
# `setWebhook` takes the webhook shared secret as the `secret_token` JSON
# body field (the value Telegram echoes on every delivery, verified by the
# `shared_secret_header` ingress recipe above). The adapter opts in by
# naming the handle; the host resolves it and inserts the VALUE at the
# declared pointer — secret bytes never reach the adapter.
body_credentials = [
  { handle = "telegram_webhook_secret", pointer = "/secret_token" },
]

# Telegram's getFile result returns a provider-relative suffix. The adapter
# validates that suffix before composing it under this single declared prefix;
# downloads use GET and cannot carry a request body.
[[channel.egress]]
scheme = "https"
host = "api.telegram.org"
methods = ["get"]
credential_handle = "telegram_bot_token"
path_prefixes = ["/file/bot{telegram_bot_token}/"]
request_body_limit_bytes = 0
response_body_limit_bytes = 5242880
injection = { type = "path_placeholder", placeholder = "telegram_bot_token" }

[channel.presentation]
supports_markdown = false
supports_threads = true
can_reply_in_threads = false
