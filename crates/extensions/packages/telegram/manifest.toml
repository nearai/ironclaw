[[tools]]
standard_op = "delete_message"
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "forbidden" }
id = "telegram.delete_message"
description = "Telegram notes: deletes for everyone where the account is allowed to, otherwise only for the account itself. A message that was already gone reports messaging.unknown_message rather than a successful delete."
effects = ["use_secret", "external_write"]
default_permission = "ask"
