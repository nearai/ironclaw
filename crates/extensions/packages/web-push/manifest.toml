# The web app's browser-notification channel: outbound-only Web Push
# (RFC 8030/8291/8292) to the user's enrolled browsers. Deployment-bound like
# Telegram — no pairing and no inbound surface; enrollment happens in the
# authenticated WebUI session, and the VAPID key material is generated and
# seeded by the host at boot (never typed by an operator).
schema_version = "reborn.extension_manifest.v3"
id = "web-push"
name = "Browser notifications"
version = "0.1.0"
description = "Web Push notifications to the web app's enrolled browsers"
trust = "first_party_requested"

[runtime]
kind = "first_party"
service = "web-push.extension/v1"

[admin_configuration]
group_id = "extension.web-push"
display_name = "Web push deployment configuration"
description = "Auto-generated VAPID application-server key material for browser push."
fields = [
  # Seeded programmatically at boot when absent; `required = false` so the
  # operator config surface never demands manual input.
  { handle = "web_push_vapid", label = "VAPID key material (auto-generated)", secret = true, required = false },
]

# ---- channel surface -------------------------------------------------------

[channel]
id = "notifications"
display_name = "Browser notifications"
inbound = false
outbound = true
conversation_model = "continuous"

# Exact push-service hosts, in lockstep with
# `ironclaw_web_push::SUPPORTED_PUSH_SERVICE_HOSTS` (pinned by
# `tests/manifest_lockstep.rs`). Endpoint paths are opaque per-subscription
# capability tokens, so the path constraint is the whole-host prefix; the
# host-level allowlist plus subscribe-time endpoint validation are the
# security boundary. `vapid_authorization` injection computes the RFC 8292
# `Authorization: vapid` header host-side from the seeded key material —
# the adapter never sees key bytes.

[[channel.egress]]
scheme = "https"
host = "fcm.googleapis.com"
methods = ["post"]
credential_handle = "web_push_vapid"
path_prefixes = ["/"]
request_body_limit_bytes = 8192
response_body_limit_bytes = 65536
injection = { type = "vapid_authorization" }

[[channel.egress]]
scheme = "https"
host = "updates.push.services.mozilla.com"
methods = ["post"]
credential_handle = "web_push_vapid"
path_prefixes = ["/"]
request_body_limit_bytes = 8192
response_body_limit_bytes = 65536
injection = { type = "vapid_authorization" }

[[channel.egress]]
scheme = "https"
host = "web.push.apple.com"
methods = ["post"]
credential_handle = "web_push_vapid"
path_prefixes = ["/"]
request_body_limit_bytes = 8192
response_body_limit_bytes = 65536
injection = { type = "vapid_authorization" }

[channel.presentation]
supports_markdown = false
supports_threads = false
max_message_chars = 1500
