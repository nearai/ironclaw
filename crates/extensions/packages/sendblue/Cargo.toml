[package]
name = "ironclaw_sendblue_extension"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Sendblue iMessage/SMS text channel"
publish = false

[package.metadata.ironclaw]
layer = "products"

[dependencies]
async-trait = "0.1"
ironclaw_extension_contracts = { path = "../../../contracts/ironclaw_extension_contracts" }
ironclaw_host_api = { path = "../../../contracts/ironclaw_host_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tracing-test = { version = "0.2", features = ["no-env-filter"] }
ironclaw_extension_contracts = { path = "../../../contracts/ironclaw_extension_contracts", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
