dns:
  listen: ":53"
  proxy_ip: "172.28.20.2"
proxy:
  http_listen: ":80"
  https_listen: ":443"
  max_request_body_bytes: 1048576
  # Test-only override: capture.test and other.test resolve to the private echo container.
  upstream_deny_cidrs: []
tls:
  ca_cert: "/etc/iron-proxy/ca.crt"
  ca_key: "/etc/iron-proxy/ca.key"
transforms:
  - name: allowlist
    config:
      domains: ["example.com", "capture.test", "other.test"]
  - name: secrets
    config:
      secrets:
        - source: { type: env, var: REAL_TOKEN }
          proxy_value: "icsbx_spike_placeholder_123"
          match_headers: ["Authorization"]
          require: true
          rules: [{ host: "capture.test" }]
log:
  level: debug
