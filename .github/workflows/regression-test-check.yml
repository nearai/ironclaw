name: Regression Test Check

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: regression-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression-test:
    name: Regression test enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin -- "$BASE_REF"

      - name: Collect current approving reviews
        id: reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          approvers=$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" |
              jq -s -r '
                add
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | map(select(.state == "APPROVED") | .user.login)
                | join(",")
              '
          )
          echo "approvers=$approvers" >> "$GITHUB_OUTPUT"

      - name: Check for a meaningful regression test or reviewed exemption
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_APPROVERS: ${{ steps.reviews.outputs.approvers }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/regression-test-check.py \
            --base "origin/${PR_BASE_REF}" \
            --head "$PR_HEAD_SHA" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --labels "$PR_LABELS" \
            --author "$PR_AUTHOR" \
            --approving-reviewers "$PR_APPROVERS"

      - name: Run regression-gate self-tests
        run: bash scripts/ci/test-regression-test-check.sh
