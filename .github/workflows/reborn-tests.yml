name: Tests (Reborn)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to test
        required: false
        type: string
      deep_generations:
        description: >-
          Enumerate longer generated lifecycle sequences (#6524 workstream 9).
          Pull requests stay at the fast depth; the nightly deep run raises it.
          Depth 3 is 39 sequences against depth 2's 12.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to test
        required: false
        type: string
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: reborn-tests-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Tests must never touch the real OS keychain (macOS Keychain auth dialog /
  # Linux Secret Service). Guarded by
  # crates/ironclaw_secrets/src/keychain.rs::os_keychain_suppressed:
  # cfg!(test) covers unit tests; this covers integration/e2e that link the
  # non-cfg(test) library.
  IRONCLAW_DISABLE_OS_KEYCHAIN: "1"
  # Generated-sequence depth for tests/integration/generated_gate_sequences.rs.
  # Evaluates to the fast depth on every trigger except a workflow_call that
  # explicitly asks for more, so a PR never pays the nightly cost. The test
  # parses this strictly and fails on a bad value rather than falling back,
  # so a typo here cannot silently downgrade the nightly lane.
  IRONCLAW_GENERATED_SEQUENCE_DEPTH: ${{ inputs.deep_generations && '3' || '2' }}
  # The same full-scope nightly reuse increases every existing proptest
  # boundary generator instead of maintaining a duplicate randomized list.
  # Proptest reports its random seed on failure for exact local replay.
  PROPTEST_CASES: ${{ inputs.deep_generations && '2048' || '256' }}
  # Pin wall-clock rendering inputs so a test cannot pass or fail on the
  # runner's locale. Reborn renders model-visible time slices, and date/number
  # formatting differs by locale, so an unpinned runner turns a formatting
  # regression into an unreproducible flake. UTC also keeps recorded fixtures
  # comparable with what a developer sees locally.
  TZ: "UTC"
  LANG: "C.UTF-8"
  # PR #5086 measured mold linking the heaviest Reborn build in parallel with
  # no OOM, so keep Cargo's default parallelism. If runner OOMs recur, restore
  # the previous one-job Cargo build serialization as the one-line fallback.
  RUSTFLAGS: "-C linker=clang -C link-arg=--ld-path=/usr/bin/mold"
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Cargo network resilience (retries, HTTP/2 multiplexing off, git-CLI fetch)
  # lives in the repo-wide .cargo/config.toml so it applies to every workflow.

jobs:
  changes:
    name: Detect Reborn test scope
    runs-on: ubuntu-latest
    outputs:
      plan_mode: ${{ steps.plan.outputs.plan_mode }}
      run_crate_tests: ${{ steps.plan.outputs.run_crate_tests }}
      crate_buckets: ${{ steps.plan.outputs.crate_buckets }}
      run_root_tests: ${{ steps.plan.outputs.run_root_tests }}
      root_partitions: ${{ steps.plan.outputs.root_partitions }}
      run_group_tests: ${{ steps.plan.outputs.run_group_tests }}
      run_integration_tests: ${{ steps.plan.outputs.run_integration_tests }}
      integration_lanes: ${{ steps.plan.outputs.integration_lanes }}
      run_coverage: ${{ steps.plan.outputs.run_coverage }}
      run_qa_replay: ${{ steps.plan.outputs.run_qa_replay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - id: plan
        name: Build affected-area test plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_args=()
          base_args=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" \
              > "${RUNNER_TEMP}/reborn-changed-files.txt"
            changed_args=(--changed-files "${RUNNER_TEMP}/reborn-changed-files.txt")
            base_args=(--base-sha "$BASE_SHA")
          fi

          python3 scripts/ci/test_reborn_pr_test_plan.py
          scripts/ci/discover-reborn-package-crates.sh \
            > "${RUNNER_TEMP}/reborn-canonical-packages.json"
          plan="$(
            python3 scripts/ci/reborn_pr_test_plan.py \
              --event "${{ github.event_name }}" \
              --canonical-packages "${RUNNER_TEMP}/reborn-canonical-packages.json" \
              "${base_args[@]}" \
              "${changed_args[@]}"
          )"
          printf '%s\n' "${plan}" | jq .
          canonical="$(cat "${RUNNER_TEMP}/reborn-canonical-packages.json")"
          if ! jq -e --argjson canonical "${canonical}" '
            .mode != "full" or (
              ([.crate_buckets[].packages[]] | sort) == ($canonical | sort)
              and .root_partitions == [0, 1, 2, 3]
              and .integration_lanes == [0, 1, 2, 3, "groups"]
              and .run_group_tests == true
              and .run_qa_replay == true
              and .coverage_mode == "full"
            )
          ' <<< "${plan}" > /dev/null; then
            echo "Full Reborn plan is not exhaustive"
            exit 1
          fi
          {
            echo "### Reborn affected-area plan"
            echo
            echo "- Mode: $(jq -r '.mode' <<< "${plan}")"
            echo "- Reasons: $(jq -r '.reasons | join("; ")' <<< "${plan}")"
            echo "- Crate buckets: $(jq -r '.crate_buckets | length' <<< "${plan}")"
            echo "- Root partitions: $(jq -c '.root_partitions' <<< "${plan}")"
            echo "- Integration lanes: $(jq -c '.integration_lanes' <<< "${plan}")"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "plan_mode=$(jq -r '.mode' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_crate_tests=$(jq -r '.crate_buckets | length > 0' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "crate_buckets=$(jq -c '.crate_buckets' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_root_tests=$(jq -r '.root_partitions | length > 0' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "root_partitions=$(jq -c '.root_partitions' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_group_tests=$(jq -r '.run_group_tests' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_integration_tests=$(jq -r '.integration_lanes | length > 0' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "integration_lanes=$(jq -c '.integration_lanes' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_coverage=$(jq -r '.coverage_mode == "full"' <<< "${plan}")" >> "$GITHUB_OUTPUT"
          echo "run_qa_replay=$(jq -r '.run_qa_replay' <<< "${plan}")" >> "$GITHUB_OUTPUT"

          scripts/ci/check-test-suite-boundaries.sh
          scripts/ci/test-reborn-changed-coverage.sh
          scripts/ci/test-reborn-coverage.sh
          scripts/ci/test-check-reborn-branch-coverage-flags.sh

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/ci/test-critical-mutation-gate.sh
            python3 scripts/ci/critical_mutation_gate.py \
              --manifest tests/integration/critical-mutation-functions.toml \
              --changed-files "${RUNNER_TEMP}/reborn-changed-files.txt" \
              --selection-only
          fi

  crate-tests:
    name: Test Reborn crate bucket (${{ matrix.bucket.name }})
    needs: changes
    if: needs.changes.outputs.run_crate_tests == 'true'
    runs-on: ubuntu-latest
    # 60->90 for llvm-cov instrumentation overhead; watch `composition-core` first (single-package bucket, most feature-loaded, zero headroom).
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      RUSTC_BOOTSTRAP: "1"
      RUSTFLAGS: "-C linker=clang -C link-arg=--ld-path=/usr/bin/mold -Zcrate-attr=feature(array_windows,debug_closure_helpers,slice_as_array)"
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      matrix:
        bucket: ${{ fromJSON(needs.changes.outputs.crate_buckets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure isolated Corepack path
        run: echo "COREPACK_HOME=${RUNNER_TEMP}/ironclaw-corepack" >> "$GITHUB_ENV"

      - name: Free disk space
        if: needs.changes.outputs.run_coverage == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # branch coverage
        with:
          toolchain: nightly-2025-11-01
          components: llvm-tools-preview

      - name: Resolve bucket settings
        id: bucket-settings
        env:
          BUCKET_PACKAGES: ${{ toJSON(matrix.bucket.packages) }}
        run: |
          needs_webui_node=false
          needs_postgres_image=false
          sccache_dist_enabled=true

          while IFS= read -r package; do
            feature_flags="$(scripts/ci/package-feature-flags.sh "$package")"
            # These packages link `ironclaw_webui`, whose build script compiles
            # the Vite frontend and therefore needs a Node/pnpm toolchain.
            case "${package}" in
              ironclaw|ironclaw_reborn_composition|ironclaw_webui)
                needs_webui_node=true
                ;;
            esac

            case "${package}" in
              ironclaw_reborn_composition|ironclaw_triggers)
                needs_postgres_image=true
                ;;
            esac

            case "${package}" in
              ironclaw|ironclaw_first_party_extension_ports|ironclaw_host_runtime|ironclaw_loop_host|ironclaw_product|ironclaw_runner|ironclaw_reborn_composition|ironclaw_webui|ironclaw_wasm)
                sccache_dist_enabled=false
                ;;
            esac
          done < <(printf '%s\n' "${BUCKET_PACKAGES}" | jq -r '.[]')

          echo "needs_webui_node=${needs_webui_node}" >> "${GITHUB_OUTPUT}"
          echo "needs_postgres_image=${needs_postgres_image}" >> "${GITHUB_OUTPUT}"
          echo "sccache_dist_enabled=${sccache_dist_enabled}" >> "${GITHUB_OUTPUT}"

      - name: Pre-pull Postgres test image
        if: ${{ steps.bucket-settings.outputs.needs_postgres_image == 'true' }}
        run: docker pull postgres:16-alpine

      - name: Enable pnpm for setup-node cache
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        run: corepack enable pnpm

      - name: Install Node.js for WebUI bundle builds
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: crates/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies
        if: ${{ steps.bucket-settings.outputs.needs_webui_node == 'true' }}
        run: |
          cd crates/ironclaw_webui/frontend
          pnpm install --frozen-lockfile

      - name: Install mold and clang
        run: |
          scripts/ci/install-ci-apt-packages.sh clang mold
          test -x /usr/bin/mold

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # ONE shared cache for all ~60 crate-test jobs instead of a per-crate
          # key. Per-crate keys produced ~60 caches (registry + target each,
          # ~0.4-0.7 GB), which blew far past GitHub's ~10 GB repo cache LRU and
          # evicted each other — so most jobs hit "No cache found", re-downloaded
          # the crates.io registry from cold, and were exposed to transient
          # download flakes (mitigated separately by .cargo/config.toml). A single
          # shared key keeps the registry + shared-dep build in one small,
          # always-resident entry, so the registry is downloaded once, not ~60x.
          #
          # `-cov` suffix: instrumented llvm-cov build is a different artifact than plain `reborn-tests-crates`; separate lineage avoids corrupting whichever restores second (same as `reborn-integration-cov` below).
          shared-key: ${{ needs.changes.outputs.run_coverage == 'true' && 'reborn-tests-crates-cov-llvm21' || 'reborn-tests-crates' }}
          # Keep saves to protected-branch and merge_group runs so the ~10 GB
          # repo cache LRU is seeded by shared states, not arbitrary PR branches.
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' }}

      - name: Setup OVH sccache
        uses: ./.github/actions/setup-sccache-dist
        with:
          scheduler-url: ${{ steps.bucket-settings.outputs.sccache_dist_enabled == 'true' && vars.SCCACHE_DIST_SCHEDULER_URL || '' }}
          auth-token: ${{ steps.bucket-settings.outputs.sccache_dist_enabled == 'true' && secrets.SCCACHE_DIST_AUTH_TOKEN || '' }}
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.run_coverage == 'true'
        uses: taiki-e/install-action@62b0f2dec647a8e604c6a0fda0e38530180dce20 # cargo-llvm-cov

      - name: Run crate tests
        env:
          BUCKET_NAME: ${{ matrix.bucket.name }}
          BUCKET_PACKAGES: ${{ toJSON(matrix.bucket.packages) }}
          EXACT_TARGETS: ${{ toJSON(matrix.bucket.exact_targets || fromJSON('[]')) }}
          COLLECT_COVERAGE: ${{ needs.changes.outputs.run_coverage }}
        run: |
          echo "Running Reborn crate bucket: ${BUCKET_NAME}"
          printf '%s\n' "${BUCKET_PACKAGES}" | jq -r '.[] | "- " + .'

          scripts/ci/run-hermetic-deterministic-suite.sh prepare-command
          export IRONCLAW_HERMETIC_SUITE_SKIP_PREPARE=1
          package_args=()
          feature_args=()
          incremental_env=()
          while IFS= read -r package; do
            package_args+=(-p "$package")
            feature_flags="$(scripts/ci/package-feature-flags.sh "$package")"
            if [[ -n "${feature_flags}" ]]; then
              features="${feature_flags#--features }"
              IFS=, read -ra package_features <<< "${features}"
              for feature in "${package_features[@]}"; do
                feature_args+=(--features "${package}/${feature}")
              done
            fi
            if [[ "$package" == "ironclaw_reborn_composition" ]]; then
              incremental_env=(env CARGO_INCREMENTAL=0)
            fi
          done < <(printf '%s\n' "${BUCKET_PACKAGES}" | jq -r '.[]')

          if [[ "${COLLECT_COVERAGE}" == "true" ]]; then
            echo "::group::cargo llvm-cov bucket ${BUCKET_NAME}"
            scripts/ci/run-hermetic-deterministic-suite.sh command \
              timeout --signal=INT --kill-after=30s 40m \
              "${incremental_env[@]}" cargo llvm-cov --branch --skip-functions \
                "${package_args[@]}" "${feature_args[@]}" --all-targets \
                --lcov --output-path "bucket-${BUCKET_NAME}.lcov" \
                test --ignore-rust-version -- --nocapture
            echo "::endgroup::"
          else
            echo "::group::cargo test affected bucket ${BUCKET_NAME}"
            if [[ "$(jq 'length' <<< "${EXACT_TARGETS}")" -gt 0 ]]; then
              while IFS=$'\t' read -r package kind name; do
                target_feature_args=()
                feature_flags="$(scripts/ci/package-feature-flags.sh "${package}")"
                if [[ -n "${feature_flags}" ]]; then
                  read -ra target_feature_args <<< "${feature_flags}"
                fi
                scripts/ci/run-hermetic-deterministic-suite.sh command \
                  timeout --signal=INT --kill-after=30s 28m \
                  cargo test -p "${package}" "--${kind}" "${name}" \
                    "${target_feature_args[@]}" --ignore-rust-version -- --nocapture
              done < <(
                jq -r '.[] | [.package, .kind, .name] | @tsv' \
                  <<< "${EXACT_TARGETS}"
              )
            else
              scripts/ci/run-hermetic-deterministic-suite.sh command \
                timeout --signal=INT --kill-after=30s 28m \
                "${incremental_env[@]}" cargo test "${package_args[@]}" \
                  "${feature_args[@]}" --ignore-rust-version --all-targets -- --nocapture
            fi
            echo "::endgroup::"
          fi

      - name: Upload bucket lcov artifact
        if: needs.changes.outputs.run_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reborn-crate-cov-bucket-${{ matrix.bucket.name }}
          path: bucket-${{ matrix.bucket.name }}.lcov
          if-no-files-found: error

  root-reborn-parity-tests:
    name: Reborn root tests (${{ matrix.partition }})
    needs: changes
    if: needs.changes.outputs.run_root_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      REBORN_ROOT_TEST_PARTITIONS: 4
      REBORN_ROOT_TEST_PARTITION: ${{ matrix.partition }}
      REBORN_ROOT_TEST_TIMEOUT: 28m
      CARGO_INCREMENTAL: "0"
      # The QA smoke binaries build a full Reborn runtime and drive whole
      # turns on the libtest current-thread stack; the combined debug async
      # frames of that pipeline overflow the 8 MiB default (measured need:
      # ~10 MiB for reborn_qa_smoke_scenarios_e2e). Same pathology and value
      # as the documented RUST_MIN_STACK in reborn_qa_recorded_behavior.rs.
      RUST_MIN_STACK: "67108864"
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 1 || 4 }}
      matrix:
        partition: ${{ fromJSON(needs.changes.outputs.root_partitions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Free disk space
        if: needs.changes.outputs.run_coverage == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install mold and clang
        run: |
          scripts/ci/install-ci-apt-packages.sh clang mold
          test -x /usr/bin/mold

      - name: Verify mold linker is active
        run: |
          clang_output="$(
            printf 'int main(void) { return 0; }\n' \
              | clang --ld-path=/usr/bin/mold -Wl,--version -x c - -o /tmp/clang-mold-check 2>&1
          )"
          printf '%s\n' "$clang_output"
          grep -qi mold <<< "$clang_output"

          printf 'fn main() { println!("mold-link-ok"); }\n' > /tmp/mold-link-check.rs
          rustc /tmp/mold-link-check.rs \
            -C linker=clang \
            -C link-arg=--ld-path=/usr/bin/mold \
            -o /tmp/mold-link-check
          test "$(/tmp/mold-link-check)" = "mold-link-ok"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # All 4 root partitions compile the *same* root-package build (they
          # only run different test partitions), so one shared cache is strictly
          # better than 4 per-partition copies (~1 GB each) — the cached target
          # is fully valid for every partition, and it stops the 4 copies from
          # crowding the shared LRU.
          shared-key: reborn-tests-root
          # Keep saves to protected-branch and merge_group runs so the ~10 GB
          # repo cache LRU is seeded by shared states, not arbitrary PR branches.
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' }}

      - name: Setup OVH sccache cache
        uses: ./.github/actions/setup-sccache-dist
        with:
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Run Reborn root tests
        run: >-
          scripts/ci/run-hermetic-deterministic-suite.sh
          command
          scripts/ci/run-reborn-root-partition.sh

  reborn-group-tests:
    name: Reborn group tests
    needs: changes
    if: needs.changes.outputs.run_group_tests == 'true'
    runs-on: ubuntu-latest
    # Group tests run sequentially in ONE job (build once, reuse artifacts), so
    # the budget must cover N suites at REBORN_GROUP_TEST_TIMEOUT each plus setup
    # — otherwise GitHub hard-kills the job before a hung suite reaches its own
    # per-test timeout and reports which one hung. 3 suites x 28m + setup < 110m.
    # If group suites grow past ~4, migrate to a package-matrix-style discovery
    # job (one suite per matrix runner) instead of bumping this number.
    timeout-minutes: 110
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      REBORN_GROUP_TEST_TIMEOUT: 28m
      CARGO_INCREMENTAL: "0"
      # Group suites build a full Reborn runtime per scenario on the libtest
      # test-thread stack, so their combined debug async frames sit within a
      # few percent of whatever stack they are given (reborn_group_triggers'
      # triggered_gate_group overflowed the 8 MiB libtest default on an
      # unrelated layout shift). Same pathology and value as the root-tests
      # job above and the documented RUST_MIN_STACK in
      # reborn_qa_recorded_behavior.rs.
      RUST_MIN_STACK: "67108864"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Free disk space
        if: needs.changes.outputs.run_coverage == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install mold and clang
        run: |
          scripts/ci/install-ci-apt-packages.sh clang mold
          test -x /usr/bin/mold

      - name: Verify mold linker is active
        run: |
          clang_output="$(
            printf 'int main(void) { return 0; }\n' \
              | clang --ld-path=/usr/bin/mold -Wl,--version -x c - -o /tmp/clang-mold-check 2>&1
          )"
          printf '%s\n' "$clang_output"
          grep -qi mold <<< "$clang_output"

          printf 'fn main() { println!("mold-link-ok"); }\n' > /tmp/mold-link-check.rs
          rustc /tmp/mold-link-check.rs \
            -C linker=clang \
            -C link-arg=--ld-path=/usr/bin/mold \
            -o /tmp/mold-link-check
          test "$(/tmp/mold-link-check)" = "mold-link-ok"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # REUSE the root partitions' cache key: the group `[[test]]` binaries
          # are part of the same root package build as the reborn_*.rs root tests,
          # so they hit the already-warm target rather than a cold cache. Minting a
          # new key would add another ~1 GB entry to the ~10 GB repo cache LRU and
          # evict the root/crate states instead of sharing them.
          shared-key: reborn-tests-root
          # Keep saves to protected-branch and merge_group runs so the ~10 GB
          # repo cache LRU is seeded by shared states, not arbitrary PR branches.
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' }}

      - name: Setup OVH sccache cache
        uses: ./.github/actions/setup-sccache-dist
        with:
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Run Reborn group tests
        run: scripts/ci/run-hermetic-deterministic-suite.sh groups

  reborn-integration-coverage:
    name: Reborn integration tests (${{ matrix.lane }})
    needs: changes
    if: needs.changes.outputs.run_integration_tests == 'true'
    runs-on: ubuntu-latest
    # Full merge/main plans instrument every flat, generated, and group suite.
    # Selected pull-request plans run only the directly affected lanes without
    # instrumentation for fast pass/fail feedback; exhaustive coverage remains
    # a merge-queue requirement.
    # Generous backstop: a cold-cache instrumented build of the Reborn closure
    # is heavier than a plain build (see the retired reborn-coverage.yml's
    # 180m budget for the same closure, run as a single job); each of these 5
    # lanes only carries a slice of the 34 int-tier suites, so 120m is ample.
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      CARGO_INCREMENTAL: "0"
      RUSTC_BOOTSTRAP: "1"
      RUSTFLAGS: "-C linker=clang -C link-arg=--ld-path=/usr/bin/mold -Zcrate-attr=feature(array_windows,debug_closure_helpers,slice_as_array)"
      # llvm-cov instrumentation inflates stack frames; the deep channel
      # admission futures (webhook -> pairing gate -> workflow) overflow the
      # default 2 MiB test-thread stack under instrumentation only. The
      # deepest subtrees are Box::pin'd at their seams; this is headroom for
      # the instrumented lane, not a substitute.
      RUST_MIN_STACK: "8388608"
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'pull_request' && 1 || 5 }}
      matrix:
        lane: ${{ fromJSON(needs.changes.outputs.integration_lanes) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure isolated Corepack path
        run: echo "COREPACK_HOME=${RUNNER_TEMP}/ironclaw-corepack" >> "$GITHUB_ENV"

      - name: Free disk space
        if: needs.changes.outputs.run_coverage == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Pre-pull Postgres test image
        run: docker pull postgres:16-alpine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # branch coverage
        with:
          toolchain: nightly-2025-11-01
          components: llvm-tools-preview

      - name: Enable pnpm for setup-node cache
        run: corepack enable pnpm

      - name: Install Node.js for instrumented WebUI bundle builds
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: crates/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies for coverage
        run: |
          cd crates/ironclaw_webui/frontend
          pnpm install --frozen-lockfile

      - name: Install mold and clang
        run: |
          scripts/ci/install-ci-apt-packages.sh clang mold
          test -x /usr/bin/mold

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # ONE shared key across all 5 instrumented lanes: they all
          # instrument the same workspace build, so a per-lane key would just
          # mint 5 near-identical multi-GB entries that crowd the ~10 GB repo
          # cache LRU. A dedicated key (never the plain `reborn-tests-*` keys
          # above) keeps an instrumented (llvm-cov) build from ever evicting
          # or being evicted by a plain one — the artifacts are incompatible.
          shared-key: ${{ needs.changes.outputs.run_coverage == 'true' && 'reborn-integration-cov-llvm21' || 'reborn-integration-tests' }}
          # Keep saves to protected-branch and merge_group runs so the ~10 GB
          # repo cache LRU is seeded by shared states, not arbitrary PR branches.
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' }}

      - name: Setup OVH sccache cache
        uses: ./.github/actions/setup-sccache-dist
        with:
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Install cargo-llvm-cov
        if: needs.changes.outputs.run_coverage == 'true'
        uses: taiki-e/install-action@62b0f2dec647a8e604c6a0fda0e38530180dce20 # cargo-llvm-cov

      - name: Run this lane's Reborn integration-tier suites
        env:
          REBORN_COV_LANE_MODE: ${{ matrix.lane == 'groups' && 'group' || 'flat-partition' }}
          REBORN_COV_LANE_PARTITIONS: 4
          REBORN_COV_LANE_INDEX: ${{ matrix.lane }}
          REBORN_COV_LANE_TEST_TIMEOUT: 45m
          REBORN_COV_COLLECT: ${{ needs.changes.outputs.run_coverage }}
        run: |
          if [[ "${REBORN_COV_COLLECT}" == "true" ]]; then
            # A shared instrumented cache can contain profraw from another
            # matrix leg. Clear only profiling data, not compiled binaries.
            cargo llvm-cov clean --profraw-only
          fi
          scripts/ci/run-hermetic-deterministic-suite.sh prepare-command
          IRONCLAW_HERMETIC_SUITE_SKIP_PREPARE=1 \
            scripts/ci/run-hermetic-deterministic-suite.sh command \
            scripts/ci/reborn-coverage-lane-run.sh part-${{ matrix.lane }}.lcov

      - name: Upload lane lcov artifact
        if: needs.changes.outputs.run_coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reborn-integration-cov-part-${{ matrix.lane }}
          path: part-${{ matrix.lane }}.lcov
          if-no-files-found: error

  coverage-report:
    name: Reborn integration-tier coverage report
    # Also needs crate-tests now: merges lane + bucket lcov, still pure text processing (no test execution), so the 10-min SLA below still holds.
    needs: [changes, reborn-integration-coverage, crate-tests]
    if: needs.changes.outputs.run_coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The sticky coverage comment upserts a PR comment via the issues API.
      pull-requests: write
      # The changed-line gate reads the base commit's own merged-lcov artifact
      # to drop lines that were already uncovered before this PR. Without this
      # scope the lookup 403s, which fails closed (every changed line counts)
      # and says so — the gate stays correct, just stricter.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download lane lcov artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reborn-integration-cov-part-*
          path: coverage-parts
          merge-multiple: true

      - name: Download crate bucket lcov artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reborn-crate-cov-bucket-*
          path: coverage-parts
          merge-multiple: true

      - name: Merge lane and bucket lcov reports
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(coverage-parts/*.lcov)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No Reborn coverage artifacts found (neither integration-tier lanes nor crate-tier buckets)" >&2
            exit 1
          fi
          scripts/ci/reborn-coverage-merge-lcov.sh reborn-integration-merged.lcov "${parts[@]}"

      - name: Render Reborn integration-tier coverage summary
        run: |
          set -euo pipefail
          scripts/ci/reborn-coverage-summary.sh \
            reborn-integration-merged.lcov \
            tests/integration/coverage-exemptions.toml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Coverage ratchet gate: compares the merged lcov above against the
      # committed floor (tests/integration/coverage-floor.toml). Still pure
      # post-processing, no test execution — stays inside this job's 10-min
      # budget. While [global].enforce = false in the floor file this always
      # exits 0 (dry-run soak period); it prints every violation regardless,
      # prefixed "[dry-run, would FAIL]", plus an unconditional mode banner.
      - name: Render Reborn coverage ratchet
        run: |
          set -euo pipefail
          scripts/ci/reborn-coverage-ratchet.sh \
            reborn-integration-merged.lcov \
            tests/integration/coverage-exemptions.toml \
            tests/integration/coverage-floor.toml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test changed-code coverage gate
        run: python3 scripts/ci/test_reborn_changed_coverage.py

      - name: Gate changed Reborn lines and branches
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # `gh` resolves the base commit's merged-lcov artifact. The checkout
          # runs with persist-credentials: false, so the token is passed here
          # rather than inherited.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/reborn_changed_coverage.py \
            --lcov reborn-integration-merged.lcov \
            --manifest tests/integration/changed-coverage-exemptions.toml \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --fetch-base-coverage \
            --json reborn-changed-coverage.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Surface the same %/hole-list as a sticky PR comment so it lives in the
      # conversation, not just the job summary. PR-only, and non-fatal by
      # design: fork PRs get a read-only GITHUB_TOKEN and the comment API
      # 403s, which must never red the check. The comment itself never gates
      # regardless of the ratchet's enforce bit (mirrors the retired
      # reborn-coverage.yml workflow's comment step) — enforcement happens in
      # the "Render Reborn coverage ratchet" step above, not here.
      - name: Post sticky coverage comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >
          scripts/ci/reborn-coverage-comment.sh
          reborn-integration-merged.lcov
          tests/integration/coverage-exemptions.toml
          tests/integration/coverage-floor.toml

      # The merged lcov is the full per-file detail behind the summary table —
      # the "real hole list" — kept as an artifact for offline inspection.
      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reborn-integration-coverage-merged
          path: |
            reborn-integration-merged.lcov
            reborn-changed-coverage.json
          if-no-files-found: warn

  critical-mutation:
    name: Critical named-function mutation gate
    needs: changes
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run critical-gate harness self-tests
        run: scripts/ci/test-critical-mutation-gate.sh

      - name: Resolve affected critical functions
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
          should_run="$(
            python3 scripts/ci/critical_mutation_gate.py \
              --manifest tests/integration/critical-mutation-functions.toml \
              --changed-files changed-files.txt \
              --selection-only
          )"
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install mold and clang
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        run: |
          scripts/ci/install-ci-apt-packages.sh clang mold
          test -x /usr/bin/mold

      - name: Install cargo-mutants
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        uses: taiki-e/install-action@62b0f2dec647a8e604c6a0fda0e38530180dce20 # v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Run affected named critical invariants
        if: github.event_name == 'merge_group' && steps.scope.outputs.should_run == 'true'
        run: |
          python3 scripts/ci/critical_mutation_gate.py \
            --manifest tests/integration/critical-mutation-functions.toml \
            --changed-files changed-files.txt

  qa-recorded-fixtures:
    name: Reborn QA recorded fixtures
    needs: changes
    if: needs.changes.outputs.run_qa_replay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ""
      LLM_BACKEND: ""
      LLM_USE_CODEX_AUTH: "false"
      OLLAMA_BASE_URL: ""
      OPENAI_API_KEY: ""
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Configure isolated Corepack path
        run: echo "COREPACK_HOME=${RUNNER_TEMP}/ironclaw-corepack" >> "$GITHUB_ENV"

      - name: Install mold
        run: |
          scripts/ci/install-ci-apt-packages.sh mold
          test -x /usr/bin/mold

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Enable pnpm for setup-node cache
        run: corepack enable pnpm

      - name: Install Node.js for QA replay WebUI bundle builds
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: crates/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies for QA replay
        run: |
          cd crates/ironclaw_webui/frontend
          pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: reborn-qa-recorded-fixtures
          save-if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' }}

      - name: Setup OVH sccache cache
        uses: ./.github/actions/setup-sccache-dist
        with:
          cache-ssh-host: ${{ vars.SCCACHE_CACHE_SSH_HOST }}
          cache-ssh-user: ${{ vars.SCCACHE_CACHE_SSH_USER }}
          cache-ssh-port: ${{ vars.SCCACHE_CACHE_SSH_PORT }}
          cache-ssh-private-key: ${{ secrets.SCCACHE_CACHE_SSH_PRIVATE_KEY }}
          cache-ssh-known-hosts: ${{ secrets.SCCACHE_CACHE_SSH_KNOWN_HOSTS }}
          redis-password: ${{ secrets.SCCACHE_REDIS_PASSWORD }}

      - name: Scrub Reborn QA fixtures
        run: |
          scripts/ci/test-check-reborn-qa-fixtures.sh
          scripts/ci/check-reborn-qa-fixtures.sh

      - name: Test fixture promotion guards
        run: |
          bash scripts/ci/test-check-reborn-qa-fixtures.sh
          python3 -m unittest scripts/ci/test-check-regression-promotions.py

      - name: Run Reborn QA fixture contracts and replay
        run: |
          scripts/ci/run-hermetic-deterministic-suite.sh prepare-command
          IRONCLAW_HERMETIC_SUITE_SKIP_PREPARE=1 \
            scripts/ci/run-hermetic-deterministic-suite.sh \
            command \
            cargo test \
            -p ironclaw_reborn_integration_tests \
            --test reborn_qa_recorded_behavior \
            -- \
            --nocapture

  reborn-tests:
    name: Tests (Reborn)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - crate-tests
      - root-reborn-parity-tests
      - reborn-group-tests
      - reborn-integration-coverage
      - coverage-report
      - critical-mutation
      - qa-recorded-fixtures
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Check Reborn test result
        run: |
          # shellcheck disable=SC1091
          if ! source .github/scripts/ci-job-result-ok.sh; then
            echo "Unable to source .github/scripts/ci-job-result-ok.sh"
            exit 1
          fi

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "changes failed: ${{ needs.changes.result }}"
            exit 1
          fi

          plan_mode="${{ needs.changes.outputs.plan_mode }}"
          case "${plan_mode}" in
            none|selected|full) ;;
            *)
              echo "Missing or invalid Reborn test plan mode: '${plan_mode}'"
              exit 1
              ;;
          esac

          for flag in \
            "${{ needs.changes.outputs.run_crate_tests }}" \
            "${{ needs.changes.outputs.run_root_tests }}" \
            "${{ needs.changes.outputs.run_group_tests }}" \
            "${{ needs.changes.outputs.run_integration_tests }}" \
            "${{ needs.changes.outputs.run_coverage }}" \
            "${{ needs.changes.outputs.run_qa_replay }}"; do
            if [[ "${flag}" != "true" && "${flag}" != "false" ]]; then
              echo "Missing or invalid Reborn test plan flag: '${flag}'"
              exit 1
            fi
          done

          if [[ "${plan_mode}" == "full" ]]; then
            for flag in \
              "${{ needs.changes.outputs.run_crate_tests }}" \
              "${{ needs.changes.outputs.run_root_tests }}" \
              "${{ needs.changes.outputs.run_group_tests }}" \
              "${{ needs.changes.outputs.run_integration_tests }}" \
              "${{ needs.changes.outputs.run_coverage }}" \
              "${{ needs.changes.outputs.run_qa_replay }}"; do
              if [[ "${flag}" != "true" ]]; then
                echo "Full Reborn plan omitted a required lane"
                exit 1
              fi
            done
          fi

          check_planned_job() {
            local name="$1"
            local result="$2"
            local expected="$3"
            if [[ "${expected}" == "false" ]]; then
              if [[ "${result}" != "skipped" ]]; then
                echo "${name} ran with result '${result}' despite planned=false"
                exit 1
              fi
              return
            fi
            if ! job_result_ok "${name}" "${result}" false "allow"; then
              echo "${name} result '${result}' did not match planned=${expected}"
              exit 1
            fi
          }

          check_planned_job "crate-tests" \
            "${{ needs.crate-tests.result }}" \
            "${{ needs.changes.outputs.run_crate_tests }}"
          check_planned_job "root-reborn-parity-tests" \
            "${{ needs.root-reborn-parity-tests.result }}" \
            "${{ needs.changes.outputs.run_root_tests }}"
          check_planned_job "reborn-group-tests" \
            "${{ needs.reborn-group-tests.result }}" \
            "${{ needs.changes.outputs.run_group_tests }}"
          check_planned_job "reborn-integration-coverage" \
            "${{ needs.reborn-integration-coverage.result }}" \
            "${{ needs.changes.outputs.run_integration_tests }}"
          check_planned_job "coverage-report" \
            "${{ needs.coverage-report.result }}" \
            "${{ needs.changes.outputs.run_coverage }}"
          check_planned_job "qa-recorded-fixtures" \
            "${{ needs.qa-recorded-fixtures.result }}" \
            "${{ needs.changes.outputs.run_qa_replay }}"

          mutation_expected=${{ github.event_name == 'merge_group' }}
          check_planned_job "critical-mutation" \
            "${{ needs.critical-mutation.result }}" \
            "${mutation_expected}"

          if [[ "${plan_mode}" == "none" ]]; then
            echo "No affected Reborn test surface — baseline recorded replay ran as planned"
          fi
