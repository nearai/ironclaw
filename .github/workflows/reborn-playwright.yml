name: Reborn Playwright

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *" # Nightly standalone Reborn browser coverage at 03:20 UTC

permissions:
  contents: read

concurrency:
  group: reborn-playwright-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-config:
    name: Configure Reborn Playwright matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - id: set
        name: Generate historical-duration and affinity-safe shards
        run: python3 scripts/ci/ws12_suite_shards.py --github-output >> "$GITHUB_OUTPUT"

  build:
    name: Build Reborn Playwright binaries
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/setup-rust

      - name: Enable pnpm for setup-node cache
        run: corepack enable pnpm

      - name: Install Node.js for WebUI bundle build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          # actions/setup-node hashes this list to build the cache key
          # (verified against the pinned commit's bundled dist/setup/index.js:
          # `hashFiles` walks one globber built from every newline-separated
          # pattern and only throws when the COMBINED walk finds nothing), so
          # the exact line stays live for today's tree (WS7 put the crate in
          # `crates/product/`) and the deeper glob picks up any later re-homing
          # without either one needing to be conditional. The two must not
          # overlap: `ws12_workflow_contracts.py` rejects a spare that already
          # matches the real location, because a pattern matching everything is
          # broad rather than depth-tolerant.
          cache-dependency-path: |
            crates/product/ironclaw_webui/frontend/pnpm-lock.yaml
            crates/*/*/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies
        run: |
          set -euo pipefail
          webui_dir="$(bash scripts/ci/crate-dir.sh ironclaw_webui)"
          cd "${webui_dir}/frontend"
          pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: reborn-playwright
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build ironclaw-reborn with WebUI surface
        run: cargo build -p ironclaw --bin ironclaw

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reborn-playwright-binaries
          path: |
            target/debug/ironclaw
          retention-days: 1

  test:
    name: Reborn Playwright (${{ matrix.group }})
    needs: [matrix-config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reborn-playwright-binaries
          path: target/debug/

      - name: Make binaries executable
        run: |
          chmod +x target/debug/ironclaw
          touch target/debug/ironclaw

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/pyproject.toml

      - name: Install Node.js for emulate-backed scenarios
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: "22"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install E2E dependencies
        run: |
          cd tests/e2e
          timeout --signal=INT --kill-after=30s 8m pip install -e .
          timeout --signal=INT --kill-after=30s 8m playwright install --with-deps chromium

      - name: Run Reborn Playwright shard
        env:
          IRONCLAW_E2E_ARTIFACT_DIR: tests/e2e/artifacts/${{ matrix.group }}
          IRONCLAW_E2E_ARTIFACT_MAX_BYTES: "268435456" # 256 MiB per shard
        run: |
          test "${{ matrix.retry }}" = "never"
          echo "Historical allocation: ${{ matrix.historical_seconds }}s; affinities: ${{ matrix.affinities }}"
          pytest ${{ matrix.files }} -v --timeout=120 --durations=25

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reborn-playwright-diagnostics-${{ matrix.group }}
          path: |
            tests/e2e/artifacts/${{ matrix.group }}/
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  reborn-playwright:
    name: Reborn Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    needs: [test]
    steps:
      - name: Check Reborn Playwright shards
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more Reborn Playwright shards failed"
            exit 1
          fi
