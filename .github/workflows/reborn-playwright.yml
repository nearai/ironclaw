name: Reborn Playwright

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *" # Nightly standalone Reborn browser coverage at 03:20 UTC

permissions:
  contents: read

concurrency:
  group: reborn-playwright-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-config:
    name: Configure Reborn Playwright matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - id: set
        name: Generate historical-duration and affinity-safe shards
        run: python3 scripts/ci/ws12_suite_shards.py --github-output >> "$GITHUB_OUTPUT"

  build:
    name: Build Reborn Playwright binaries
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Enable pnpm for setup-node cache
        run: corepack enable pnpm

      - name: Install Node.js for WebUI bundle build
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: crates/ironclaw_webui/frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies
        run: |
          cd crates/ironclaw_webui/frontend
          pnpm install --frozen-lockfile

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: reborn-playwright
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build ironclaw-reborn with WebUI surface
        run: cargo build -p ironclaw --bin ironclaw

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reborn-playwright-binaries
          path: |
            target/debug/ironclaw
          retention-days: 1

  test:
    name: Reborn Playwright (${{ matrix.group }})
    needs: [matrix-config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reborn-playwright-binaries
          path: target/debug/

      - name: Make binaries executable
        run: |
          chmod +x target/debug/ironclaw
          touch target/debug/ironclaw

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/pyproject.toml

      - name: Install Node.js for emulate-backed scenarios
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: "22"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install E2E dependencies
        run: |
          cd tests/e2e
          pip install -e .
          playwright install --with-deps chromium

      - name: Run Reborn Playwright shard
        env:
          IRONCLAW_E2E_ARTIFACT_DIR: tests/e2e/artifacts/${{ matrix.group }}
          IRONCLAW_E2E_ARTIFACT_MAX_BYTES: "268435456" # 256 MiB per shard
        run: |
          test "${{ matrix.retry }}" = "never"
          echo "Historical allocation: ${{ matrix.historical_seconds }}s; affinities: ${{ matrix.affinities }}"
          pytest ${{ matrix.files }} -v --timeout=120 --durations=25

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reborn-playwright-diagnostics-${{ matrix.group }}
          path: |
            tests/e2e/artifacts/${{ matrix.group }}/
            tests/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

  reborn-playwright:
    name: Reborn Playwright
    runs-on: ubuntu-latest
    if: always()
    needs: [test]
    steps:
      - name: Check Reborn Playwright shards
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more Reborn Playwright shards failed"
            exit 1
          fi
