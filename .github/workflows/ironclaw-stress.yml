name: IronClaw Stress

on:
  pull_request:
    # Each governed crate is listed twice on purpose: at the family path it
    # occupies today (crates/<family>/ironclaw_*, PROPOSAL §5 — landed in WS7)
    # and at the family-agnostic `crates/*/ironclaw_*` form, so a later
    # re-homing into a different family keeps the lane hooked. A `paths:`
    # filter that matches nothing does not fail — the workflow simply stops
    # triggering, which is the WS10 silent failure mode (#6963). GitHub's `*`
    # does not cross `/`, so the two forms are written out rather than folded
    # into one glob. This stays an enumerated scope rather
    # than `crates/**` because the PR lane runs a 20-minute libsql suite;
    # scripts/ci/ws12_workflow_contracts.py pins every name here against the
    # real crate inventory and asserts a glob matches each crate's ACTUAL
    # directory, so a rename or a deeper move fails loudly in Code Style
    # instead of silently unhooking this workflow.
    paths:
      - "tools/ironclaw_stress/**"
      - "crates/substrates/ironclaw_filesystem/**"
      - "crates/*/ironclaw_filesystem/**"
      - "crates/domains/ironclaw_threads/**"
      - "crates/*/ironclaw_threads/**"
      - "crates/kernel/ironclaw_turns/**"
      - "crates/*/ironclaw_turns/**"
      - "crates/kernel/ironclaw_resources/**"
      - "crates/*/ironclaw_resources/**"
      - "crates/contracts/ironclaw_host_api/**"
      - "crates/*/ironclaw_host_api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ironclaw-stress.yml"
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  schedule:
    - cron: "30 3 * * *" # Daily libsql stress scan at 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ironclaw-stress-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_RELEASE_DEBUG: 0
  IRONCLAW_DISABLE_OS_KEYCHAIN: "1"

jobs:
  libsql-bottleneck-suite:
    name: libsql bottleneck suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ironclaw-stress-libsql
          save-if: ${{ github.event_name == 'schedule' || github.event_name == 'merge_group' }}

      - name: Run fast libsql bottleneck suite
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          mkdir -p target/ironclaw-stress
          cargo run -p ironclaw_stress --release -- \
            --backend libsql \
            --suite bottleneck-finder \
            --operations 2 \
            --concurrency 1 \
            --users 5 \
            --progress-interval-seconds 0 \
            --human-read \
            --bottleneck-report \
            --output-jsonl target/ironclaw-stress/pr-suite.jsonl \
            --max-failure-rate 0.05 \
            --max-p95-ms 3000 \
            --max-rss-mb 1024 \
            > target/ironclaw-stress/pr-suite-summary.json \
            2> target/ironclaw-stress/pr-suite-report.txt

      - name: Run nightly libsql bottleneck suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # The suite-wide p95 ceiling must clear the model-tail case, which
        # injects a synthetic 2.0s model wait by design — the previous 1500ms
        # ceiling was structurally unsatisfiable and failed every nightly scan
        # (the PR variant of this suite already runs with 3000ms). Per-case
        # ceilings in ironclaw_stress would be the proper fix if the coarse
        # global cap keeps biting.
        run: |
          mkdir -p target/ironclaw-stress
          cargo run -p ironclaw_stress --release -- \
            --backend libsql \
            --suite bottleneck-finder \
            --operations 20 \
            --concurrency 4 \
            --users 50 \
            --progress-interval-seconds 0 \
            --human-read \
            --bottleneck-report \
            --output-jsonl target/ironclaw-stress/nightly-suite.jsonl \
            --max-failure-rate 0.02 \
            --max-p95-ms 2500 \
            --max-rss-mb 1024 \
            > target/ironclaw-stress/nightly-suite-summary.json \
            2> target/ironclaw-stress/nightly-suite-report.txt

      - name: Upload stress suite artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-libsql-suite
          path: |
            target/ironclaw-stress/pr-suite.jsonl
            target/ironclaw-stress/pr-suite-summary.json
            target/ironclaw-stress/pr-suite-report.txt
            target/ironclaw-stress/nightly-suite.jsonl
            target/ironclaw-stress/nightly-suite-summary.json
            target/ironclaw-stress/nightly-suite-report.txt
          if-no-files-found: ignore

  libsql-concurrency-ramp:
    name: libsql concurrency ramp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ironclaw-stress-ramp
          save-if: ${{ github.event_name == 'schedule' }}

      - name: Run libsql chat-baseline concurrency ramp
        run: |
          mkdir -p target/ironclaw-stress
          cargo run -p ironclaw_stress --release -- \
            --backend libsql \
            --preset chat-baseline \
            --concurrency 2 \
            --ramp-concurrency 32 \
            --operations 30 \
            --users 100 \
            --progress-interval-seconds 0 \
            --human-read \
            --bottleneck-report \
            --max-failure-rate 0.01 \
            --max-p95-ms 1000 \
            > target/ironclaw-stress/concurrency-ramp-summary.json \
            2> target/ironclaw-stress/concurrency-ramp-report.txt

      - name: Upload stress ramp artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-libsql-ramp
          path: |
            target/ironclaw-stress/concurrency-ramp-summary.json
            target/ironclaw-stress/concurrency-ramp-report.txt
          if-no-files-found: ignore

  libsql-user-session-soak:
    name: libsql user-session soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ironclaw-stress-soak
          save-if: ${{ github.event_name == 'schedule' }}
      - name: Run bounded libsql user-session soak
        run: |
          mkdir -p target/ironclaw-stress
          cargo run --locked -p ironclaw_stress --release -- \
            --backend libsql \
            --preset soak-user-session \
            --trace-jsonl target/ironclaw-stress/soak-trace.jsonl \
            --human-read \
            --bottleneck-report \
            > target/ironclaw-stress/soak-summary.json \
            2> target/ironclaw-stress/soak-report.txt
      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-libsql-soak
          path: |
            target/ironclaw-stress/soak-trace.jsonl
            target/ironclaw-stress/soak-summary.json
            target/ironclaw-stress/soak-report.txt
          if-no-files-found: error
          retention-days: 14

  libsql-scripted-memory:
    name: libsql scripted memory matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
      IRONCLAW_DISABLE_OS_KEYCHAIN: "1"
      SECRETS_MASTER_KEY: stress-ci-secret-master-key-0123456789abcdef
      IRONCLAW_REBORN_RUNNER_WORKER_COUNT: "0"
      IRONCLAW_REBORN_RUNNER_MAX_CONCURRENT_RUNS_PER_USER: "0"
      IRONCLAW_REBORN_RUNNER_MAX_CONCURRENT_TRIGGER_RUNS: "0"
      IRONCLAW_REBORN_WEBUI_TOKEN: stress-ci-webui-token-0123456789abcdef0123456789abcdef
      IRONCLAW_REBORN_WEBUI_USER_ID: stress-ci-user
      LLM_API_KEY: stress-ci-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Node.js for WebUI bundle build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies
        run: |
          set -euo pipefail
          webui_dir="$(bash scripts/ci/crate-dir.sh ironclaw_webui)"
          cd "${webui_dir}/frontend"
          pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ironclaw-stress-libsql-scripted
          save-if: ${{ github.event_name == 'schedule' }}

      - name: Build shipping-profile hosted server and stress runner
        run: |
          cargo build --locked --profile dist \
            --package ironclaw \
            --bin ironclaw
          cargo build --release --package ironclaw_stress

      - name: Run libsql scripted memory matrix
        run: |
          set -euo pipefail
          mkdir -p target/ironclaw-stress "$RUNNER_TEMP/ironclaw-reborn-home-libsql"
          cat > "$RUNNER_TEMP/ironclaw-reborn-home-libsql/config.toml" <<'EOF'
          api_version = "ironclaw.runtime/v1"

          [boot]
          profile = "hosted-single-tenant-volume"

          [identity]
          default_owner = "stress-ci-user"
          tenant = "stress-ci"
          default_agent = "stress-ci-agent"

          [runner]
          worker_count = 0
          max_concurrent_runs_per_user = 0
          max_concurrent_trigger_runs = 0

          [llm.default]
          provider_id = "openai"
          model = "stress-mock"
          base_url = "http://127.0.0.1:19090/v1"
          api_key_env = "LLM_API_KEY"
          EOF

          IRONCLAW_REBORN_HOME="$RUNNER_TEMP/ironclaw-reborn-home-libsql" \
            target/dist/ironclaw serve \
              --host 127.0.0.1 \
              --port 18080 \
              > target/ironclaw-stress/libsql-scripted-server.log \
              2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 120); do
            if curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "ironclaw-reborn exited before becoming healthy" >&2
              cat target/ironclaw-stress/libsql-scripted-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:18080/api/health >/dev/null
          for _ in $(seq 1 120); do
            if curl -fsS --connect-timeout 5 --max-time 10 \
              -H "Authorization: Bearer $IRONCLAW_REBORN_WEBUI_TOKEN" \
              http://127.0.0.1:18080/api/webchat/v2/session >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "ironclaw-reborn exited before WebUI API readiness" >&2
              cat target/ironclaw-stress/libsql-scripted-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS --connect-timeout 5 --max-time 10 \
            -H "Authorization: Bearer $IRONCLAW_REBORN_WEBUI_TOKEN" \
            http://127.0.0.1:18080/api/webchat/v2/session >/dev/null

          # Scripted memory matrix: the server stays alive for the whole
          # loop; each invocation rebinds the mock LLM sidecar at 19090 (the
          # server's LLM base_url) and releases it on exit, so the runs are
          # strictly sequential. `--max-failure-rate 0` is the zero-tolerance
          # gate: any failed, leaked, missing, or undisclosed scripted verdict
          # fails the job. A failed invocation must NOT abort the loop under
          # set -e: the later scripts still run and upload their evidence,
          # the failure is remembered, and the step exits nonzero after every
          # script has had its chance.
          failed=0
          for script in memory_roundtrip memory_grow memory_mixed; do
            outdir="target/ironclaw-stress/ironclaw-stress-libsql-scripted-${script}"
            mkdir -p "${outdir}"
            target/release/ironclaw_stress \
              --backend libsql \
              --scenario api-user-capacity \
              --api-base-url http://127.0.0.1:18080 \
              --api-admin-bearer-token "$IRONCLAW_REBORN_WEBUI_TOKEN" \
              --users 6 \
              --concurrency 3 \
              --operations 4 \
              --api-scripted-tool "${script}" \
              --api-scripted-doc-sizes 4096,32768,131072,1048576 \
              --api-hot-writers 2 \
              --mock-llm-bind 127.0.0.1:19090 \
              --mock-llm-latency-ms 250 \
              --api-poll-interval-ms 10000 \
              --api-terminal-timeout-ms 120000 \
              --progress-interval-seconds 0 \
              --human-read \
              --bottleneck-report \
              --output-jsonl "${outdir}/summary.jsonl" \
              --max-failure-rate 0 \
              --max-p95-ms 120000 \
              > "${outdir}/summary.json" \
              2> "${outdir}/report.txt" || failed=1
          done
          exit "$failed"

      - name: Upload libsql scripted memory_roundtrip artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-libsql-scripted-memory-roundtrip
          path: |
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_roundtrip/summary.jsonl
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_roundtrip/summary.json
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_roundtrip/report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload libsql scripted memory_grow artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-libsql-scripted-memory-grow
          path: |
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_grow/summary.jsonl
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_grow/summary.json
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_grow/report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload libsql scripted memory_mixed artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-libsql-scripted-memory-mixed
          path: |
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_mixed/summary.jsonl
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_mixed/summary.json
            target/ironclaw-stress/ironclaw-stress-libsql-scripted-memory_mixed/report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload libsql scripted server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-libsql-scripted-server-log
          path: |
            target/ironclaw-stress/libsql-scripted-server.log
          if-no-files-found: error
          retention-days: 14

  postgres-api-capacity:
    name: hosted-single-tenant Postgres API capacity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ironclaw_stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
      IRONCLAW_DISABLE_OS_KEYCHAIN: "1"
      IRONCLAW_REBORN_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/ironclaw_stress
      IRONCLAW_REBORN_SECRET_MASTER_KEY: stress-ci-secret-master-key-0123456789abcdef
      IRONCLAW_REBORN_POSTGRES_RESOURCE_GOVERNOR_SINGLETON: "true"
      IRONCLAW_REBORN_POSTGRES_POOL_MAX_SIZE: "32"
      IRONCLAW_REBORN_RUNNER_WORKER_COUNT: "0"
      IRONCLAW_REBORN_RUNNER_MAX_CONCURRENT_RUNS_PER_USER: "0"
      IRONCLAW_REBORN_RUNNER_MAX_CONCURRENT_TRIGGER_RUNS: "0"
      IRONCLAW_REBORN_WEBUI_TOKEN: stress-ci-webui-token-0123456789abcdef0123456789abcdef
      IRONCLAW_REBORN_WEBUI_USER_ID: stress-ci-user
      LLM_API_KEY: stress-ci-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install Node.js for WebUI bundle build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install WebUI frontend dependencies
        run: |
          set -euo pipefail
          webui_dir="$(bash scripts/ci/crate-dir.sh ironclaw_webui)"
          cd "${webui_dir}/frontend"
          pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ironclaw-stress-postgres-api
          save-if: ${{ github.event_name == 'schedule' }}

      - name: Build shipping-profile hosted server and stress runner
        run: |
          cargo build --locked --profile dist \
            --package ironclaw \
            --bin ironclaw
          cargo build --release --package ironclaw_stress

      - name: Run hosted-single-tenant Postgres API capacity workload
        run: |
          set -euo pipefail
          mkdir -p target/ironclaw-stress "$RUNNER_TEMP/ironclaw-reborn-home"
          cat > "$RUNNER_TEMP/ironclaw-reborn-home/config.toml" <<'EOF'
          api_version = "ironclaw.runtime/v1"

          [boot]
          profile = "hosted-single-tenant"

          [identity]
          default_owner = "stress-ci-user"
          tenant = "stress-ci"
          default_agent = "stress-ci-agent"

          [storage]
          backend = "postgres"
          url_env = "IRONCLAW_REBORN_POSTGRES_URL"
          secret_master_key_env = "IRONCLAW_REBORN_SECRET_MASTER_KEY"
          pool_max_size = 32

          [runner]
          worker_count = 0
          max_concurrent_runs_per_user = 0
          max_concurrent_trigger_runs = 0

          [llm.default]
          provider_id = "openai"
          model = "stress-mock"
          base_url = "http://127.0.0.1:19090/v1"
          api_key_env = "LLM_API_KEY"
          EOF

          IRONCLAW_REBORN_HOME="$RUNNER_TEMP/ironclaw-reborn-home" \
            target/dist/ironclaw serve \
              --host 127.0.0.1 \
              --port 18080 \
              > target/ironclaw-stress/postgres-api-server.log \
              2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "ironclaw-reborn exited before becoming healthy" >&2
              cat target/ironclaw-stress/postgres-api-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health >/dev/null
          for _ in $(seq 1 120); do
            if curl -fsS \
              -H "Authorization: Bearer $IRONCLAW_REBORN_WEBUI_TOKEN" \
              http://127.0.0.1:18080/api/webchat/v2/session >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "ironclaw-reborn exited before WebUI API readiness" >&2
              cat target/ironclaw-stress/postgres-api-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS \
            -H "Authorization: Bearer $IRONCLAW_REBORN_WEBUI_TOKEN" \
            http://127.0.0.1:18080/api/webchat/v2/session >/dev/null

          target/release/ironclaw_stress \
            --backend libsql \
            --scenario api-user-capacity \
            --api-base-url http://127.0.0.1:18080 \
            --api-admin-bearer-token "$IRONCLAW_REBORN_WEBUI_TOKEN" \
            --api-admin-provisioners 4 \
            --users 100 \
            --concurrency 25 \
            --operations 1 \
            --api-read-qps-per-user 1 \
            --api-read-workers 25 \
            --api-read-mix list_threads=50,timeline=45,session=5 \
            --mock-llm-bind 127.0.0.1:19090 \
            --mock-llm-latency-ms 3000 \
            --progress-interval-seconds 0 \
            --human-read \
            --bottleneck-report \
            --output-jsonl target/ironclaw-stress/postgres-api-capacity.jsonl \
            --max-failure-rate 0.01 \
            --max-p95-ms 7000 \
            > target/ironclaw-stress/postgres-api-capacity-summary.json \
            2> target/ironclaw-stress/postgres-api-capacity-report.txt

          # Scripted tool-write leg: the first stress invocation exited,
          # releasing the mock sidecar port; the server keeps running and
          # this leg rebinds the sidecar at the same address the server's
          # LLM base_url points at. Each operation is a scripted memory
          # write/read-back through the real capability host (issue #7360
          # Phase 1); the scripted summary reports read-back verdicts and
          # stage latencies per document size. The runner cycles the
          # doc-size list by operation index, so 4 operations exercise all
          # four configured sizes (4096/32768/131072/1048576) — the same
          # small-to-large curve and timing profile (10s poll, 120s
          # terminal/p95 ceilings) as the libsql matrix. Runs inside this
          # block so the server stays alive until both workloads complete.
          target/release/ironclaw_stress \
            --backend libsql \
            --scenario api-user-capacity \
            --api-base-url http://127.0.0.1:18080 \
            --api-admin-bearer-token "$IRONCLAW_REBORN_WEBUI_TOKEN" \
            --users 6 \
            --concurrency 3 \
            --operations 4 \
            --api-scripted-tool memory_roundtrip \
            --api-scripted-doc-sizes 4096,32768,131072,1048576 \
            --api-hot-writers 2 \
            --mock-llm-bind 127.0.0.1:19090 \
            --mock-llm-latency-ms 250 \
            --api-poll-interval-ms 10000 \
            --api-terminal-timeout-ms 120000 \
            --progress-interval-seconds 0 \
            --human-read \
            --bottleneck-report \
            --output-jsonl target/ironclaw-stress/postgres-api-scripted.jsonl \
            --max-failure-rate 0 \
            --max-p95-ms 120000 \
            > target/ironclaw-stress/postgres-api-scripted-summary.json \
            2> target/ironclaw-stress/postgres-api-scripted-report.txt

      - name: Upload Postgres API capacity artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-postgres-api-capacity
          path: |
            target/ironclaw-stress/postgres-api-server.log
            target/ironclaw-stress/postgres-api-capacity.jsonl
            target/ironclaw-stress/postgres-api-capacity-summary.json
            target/ironclaw-stress/postgres-api-capacity-report.txt
            target/ironclaw-stress/postgres-api-scripted.jsonl
            target/ironclaw-stress/postgres-api-scripted-summary.json
            target/ironclaw-stress/postgres-api-scripted-report.txt
          if-no-files-found: ignore

      - name: Upload Postgres scripted memory roundtrip artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironclaw-stress-postgres-scripted-memory-roundtrip
          path: |
            target/ironclaw-stress/postgres-api-scripted.jsonl
            target/ironclaw-stress/postgres-api-scripted-summary.json
            target/ironclaw-stress/postgres-api-scripted-report.txt
          if-no-files-found: error
          retention-days: 14
