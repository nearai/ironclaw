name: Nightly Deep CI

# The v1 legacy monolith (src/) and its deep suites (the former
# .github/workflows/test.yml and .github/workflows/e2e.yml) were deleted
# under Tier B ("Clean up old architecture" roadmap;
# docs/internal/plans/2026-07-02-reborn-internal-module-refactor.md §8). Only the
# Reborn suites remain, reused below.
#
# Cross-cutting platform and compatibility coverage is reused from
# .github/workflows/platform-and-compat.yml:
# - WASM/WIT compatibility checks
# - Windows compile matrix
# - benchmark compilation
# - Docker image compilation remains disabled here via include_docker: false
#
# The Reborn binary suites are reused the same way:
# - .github/workflows/reborn-tests.yml: per-crate tests across the Reborn
#   crate families plus the partitioned root parity tests (with
#   event_name == schedule, scope detection short-circuits to full scope)
# - .github/workflows/reborn-e2e.yml: deterministic Rust contract gate
#   (architecture/runtimes/substrates) plus gateway and WebUI v2 smoke
#   (workflow_call bypasses the PR path filters, so the full gate runs)
#
# Docker is intentionally excluded here because QA/release Docker images are
# owned by the separate Docker pipeline and need release-team alignment.
# Browser E2E runs against the Reborn WebChat surface via
# .github/workflows/reborn-e2e.yml (reused below).

on:
  schedule:
    - cron: "0 4 * * *" # Daily deterministic deep CI at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-deep-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-and-compat:
    name: Platform & Compat
    uses: ./.github/workflows/platform-and-compat.yml
    # The called workflow's version-check job declares job-level
    # `pull-requests: read` + `issues: read`. A called workflow may not
    # request more than the caller grants, and that is validated at trigger
    # time even though the job itself is event-gated off schedule runs — the
    # caller must grant the superset or the whole run is a startup_failure
    # with zero jobs.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      include_docker: false

  reborn-tests:
    name: Reborn Tests
    uses: ./.github/workflows/reborn-tests.yml
    # Two call-contract requirements, both validated at trigger time; a
    # violation turns the whole nightly run into a startup_failure with ZERO
    # jobs — including nightly-alert, so nothing reports it. This workflow
    # had no successful run from its creation (2026-05-06) through 2026-07-08
    # (65 of 74 retained runs are startup_failures) because of stacked
    # violations of exactly these rules:
    # 1. The called workflow's coverage-report job declares job-level
    #    `pull-requests: write` and `actions: read`; the caller must grant
    #    both. The `actions: read` scope arrived with #7018's changed-line
    #    coverage gate (it fetches the base commit's merged-lcov artifact) and
    #    is the exact omission that turned every nightly run from 2026-08-03
    #    onward into a zero-job startup_failure.
    # 2. reborn-tests.yml references secrets.SCCACHE_*; the caller must pass
    #    secrets (`secrets: inherit`).
    permissions:
      contents: read
      pull-requests: write
      actions: read
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      # Workstream 9 of #6524: longer generated lifecycle orderings than a
      # pull request can afford (84 sequences vs 20).
      deep_generations: true

  reborn-e2e:
    name: Reborn E2E
    uses: ./.github/workflows/reborn-e2e.yml
    with:
      ref: ${{ github.sha }}
      # Workstream 3 of #6524: mutating journeys share one provider world, so
      # reversing them can expose state leaking from a different journey.
      # Too slow to repeat per PR, cheap once a night.
      reversed_journey_order: true
      # Workstream 3 of #6524: proves each mutating journey stands on its own,
      # which the shared ordinary lane cannot show. One server start per
      # journey, so nightly only.
      alone_journey_replay: true

  mutation-frontier:
    name: Mutation frontier audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Install pinned cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0
      - name: Self-test mutation audit guardrails
        run: scripts/test-mutation-audit.sh
      - name: Audit escaped-bug frontier
        env:
          MUT_ITERATE: "1"
          MUT_JOBS: "3"
          MUT_OUT: target/nightly-mutation
          MUT_TIMEOUT: "300"
        # Targets the dispatch routing logic itself. Keep this pointed at a file
        # with real mutable statements — a pure `pub use` re-export file yields
        # zero mutants and makes this step silently vacuous.
        #
        # The crate directory is resolved through the shared inventory
        # (scripts/ci/crate-dir.sh) rather than the flat `crates/
        # ironclaw_capabilities` literal, so this step needs no edit when the
        # crate moves into a family directory (PROPOSAL §5) — a stale literal
        # here used to be a SILENT failure: cargo-mutants would match zero
        # mutants under a path that no longer exists and report a clean run
        # over code it never read. `set -e` aborts here if resolution itself
        # fails; scripts/mutation-audit.sh's own file-existence guard is the
        # second layer, catching dispatch.rs being renamed within a crate that
        # still resolves.
        run: |
          set -euo pipefail
          capabilities_dir="$(bash scripts/ci/crate-dir.sh ironclaw_capabilities)"
          scripts/mutation-audit.sh -p ironclaw_capabilities "${capabilities_dir}/src/dispatch.rs"
      - name: Upload mutation triage queue
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-mutation-frontier
          path: target/nightly-mutation/mutants.out/
          if-no-files-found: error
          retention-days: 14

# Failure reporting: nightly-watchdog.yml checks this workflow's latest
# scheduled run from outside and posts failures to Slack. An in-run alert
# job cannot do that — it dies with its own run on a startup_failure.
