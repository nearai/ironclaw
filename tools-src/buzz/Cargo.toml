[package]
name = "buzz-tool"
version = "0.2.3"
edition = "2021"
description = "Buzz messaging tool for IronClaw (WASM component)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.51.0"
nostr = "0.45"
bech32 = "0.12"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1


[workspace]
