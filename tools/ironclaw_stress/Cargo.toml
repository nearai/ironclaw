[package]
name = "ironclaw_stress"
version = "0.1.0"
edition = "2024"
default-run = "ironclaw_stress"
rust-version = "1.92"
description = "Stress suite for IronClaw infrastructure bottleneck discovery"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"
publish = false

[package.metadata.ironclaw]
layer = "app"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
deadpool-postgres = "0.14"
ironclaw_filesystem = { path = "../../crates/substrates/ironclaw_filesystem", version = "0.1.0" }
ironclaw_host_api = { path = "../../crates/contracts/ironclaw_host_api", version = "0.1.0" }
ironclaw_llm = { path = "../../crates/domains/ironclaw_llm", version = "0.1.0", features = ["registry-provider-factory"] }
ironclaw_resources = { path = "../../crates/kernel/ironclaw_resources", version = "0.1.0" }
ironclaw_secrets = { path = "../../crates/substrates/ironclaw_secrets", version = "0.1.0" }
ironclaw_threads = { path = "../../crates/domains/ironclaw_threads", version = "0.1.0" }
ironclaw_loop_contracts = { path = "../../crates/contracts/ironclaw_loop_contracts" }
ironclaw_turns = { path = "../../crates/kernel/ironclaw_turns", version = "0.1.0" }
ironclaw_processes = { path = "../../crates/kernel/ironclaw_processes", version = "0.1.0" }
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote", "tls"] }
libc = "0.2"
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rig = { package = "rig-core", version = "0.33" }
ironclaw_auth = { path = "../../crates/domains/ironclaw_auth" }
ironclaw_composition = { path = "../../crates/app/ironclaw_composition", features = ["test-support"] }
ironclaw_libsql_runtime = { path = "../../crates/substrates/ironclaw_libsql_runtime" }
ironclaw_triggers = { path = "../../crates/domains/ironclaw_triggers" }
secrecy = "0.10"
tempfile = "3"
